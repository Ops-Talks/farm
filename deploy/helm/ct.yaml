remote: origin
target-branch: main
# chart-dirs is set to deploy/helm so that `ct lint --config deploy/helm/ct.yaml`
# works without an extra --chart-dirs flag on the CLI. Both ci.yml and
# helm-lint.yml invoke ct without --chart-dirs; the path is relative to the
# repository root (the working directory when ct runs in CI).
chart-dirs:
  - deploy/helm
chart-repos:
  - bitnami=https://charts.bitnami.com/bitnami
  - prometheus-community=https://prometheus-community.github.io/helm-charts
  - grafana=https://grafana.github.io/helm-charts
validate-chart-schema: true
check-version-increment: false
install-namespace: ct-test
chart-values:
  - ci/kind-values.yaml
helm-extra-args: "--timeout 10m"
