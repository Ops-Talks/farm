# Default values for the Farm Helm chart.
# Override any value with -f my-values.yaml or --set key=value.

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full release name used in resource names.
fullnameOverride: ""

# -- Global image settings. Individual overrides are available under api.image and web.image.
global:
  # -- Container registry prefix applied to both images when set.
  # Example: "ghcr.io/ops-talks" — leave empty to use image.repository as-is.
  imageRegistry: ""
  # -- Global image pull secrets applied to all pods.
  imagePullSecrets: []

# ─── API ─────────────────────────────────────────────────────────────────────

api:
  # -- Number of API replicas (overrides global replicaCount).
  replicaCount: 1

  # -- Deployment rolling update strategy.
  # maxUnavailable: 0 ensures the old pod stays up until the new pod is ready.
  # With replicaCount: 1, there is no spare capacity during the rollout —
  # the new pod must start before the old pod is removed, which can briefly
  # queue connections. Use replicaCount >= 2 for true zero-downtime updates.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # -- Minimum seconds a pod must be Ready before it is considered available.
  # Prevents new pods from receiving traffic before they stabilize past
  # their startup probe window.
  minReadySeconds: 10

  image:
    # -- Container registry. Combined with repository: <registry>/<repository>:<tag>.
    registry: ""
    repository: ops-talks/farm-api
    tag: ""   # defaults to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent

  # -- Image pull secrets specific to the API pod.
  imagePullSecrets: []

  serviceAccount:
    # -- Create a dedicated ServiceAccount for the API pod.
    create: true
    # -- Cloud workload identity annotations (provider-specific, set by operator):
    #   EKS IRSA:             eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>
    #   GKE Workload Identity: iam.gke.io/service-account: <gsa>@<project>.iam.gserviceaccount.com
    #   AKS Pod Identity:     azure.workload.identity/client-id: <client-id>
    annotations: {}
    # -- Override the generated ServiceAccount name.
    name: ""
    # -- Controls automountServiceAccountToken on the ServiceAccount resource.
    # Set to true when using workload identity mechanisms that require the
    # default service account token to be projected into the pod.
    automountServiceAccountToken: false

  # -- Annotations added to the API Deployment pod template.
  podAnnotations: {}

  # -- Labels added to the API Deployment pod template.
  podLabels: {}

  # -- Security context applied at the pod level.
  podSecurityContext:
    fsGroup: 1001

  # -- Security context applied to the API container.
  # UID 1001 matches the `farmapi` user baked into apps/api/Dockerfile and the
  # `nextjs` user in apps/web/Dockerfile (see FARM-S540).
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 3000

  # -- CPU and memory resource requests/limits.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Liveness probe configuration.
  # Uses /api/health/live (process-only, no DB check) so that a slow database
  # backup, vacuum, or transient connection spike does NOT cause Kubernetes to
  # restart a healthy pod. Only the readiness probe checks external
  # dependencies — a pod that cannot serve traffic will be removed from the
  # load-balancer rotation without being killed and restarted.
  livenessProbe:
    httpGet:
      path: /api/health/live
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Readiness probe configuration. Uses /api/health which checks DB,
  # memory, and disk. A pod that fails readiness is removed from load-balancer
  # rotation but NOT restarted, keeping the process alive for debugging.
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Startup probe configuration. Runs before liveness/readiness; prevents
  # premature restarts during slow cold starts.
  startupProbe:
    httpGet:
      path: /api/health
      port: 3000
    failureThreshold: 20
    periodSeconds: 5

  # -- Extra environment variables injected directly into the container.
  # These supplement (and override) the values generated from api.env below.
  extraEnv: []
  # - name: SOME_VAR
  #   value: "some-value"

  # -- Extra volumes for the API pod (e.g., emptyDir for /tmp when readOnlyRootFilesystem is true).
  extraVolumes: []
  # - name: tmp
  #   emptyDir: {}

  # -- Extra volume mounts for the API container.
  extraVolumeMounts: []
  # - name: tmp
  #   mountPath: /tmp

  # -- Seconds Kubernetes waits after SIGTERM before sending SIGKILL.
  # Set to at least the longest expected in-flight request duration.
  # The preStop sleep below counts against this budget.
  terminationGracePeriodSeconds: 30

  # -- Container lifecycle hooks.
  # The preStop sleep allows kube-proxy to finish draining in-flight connections
  # before SIGTERM is sent to the application process. Without this, requests
  # routed to a terminating pod can receive connection-refused errors.
  lifecycle:
    preStop:
      exec:
        command: ["sleep", "5"]

  # -- Application environment configuration (non-sensitive).
  # All values end up in a ConfigMap and are injected via envFrom.
  env:
    NODE_ENV: production
    DATABASE_SYNC: "false"
    CACHE_TTL: "30"
    ALLOWED_ORIGINS: ""
    PLUGINS_DIR: ./plugins
    REDIS_SENTINEL_HOSTS: ""
    REDIS_SENTINEL_NAME: "mymaster"
    DATABASE_POOL_CONNECT_TIMEOUT: "5000"
    DATABASE_STATEMENT_TIMEOUT: "30000"
    DATABASE_POOL_IDLE_TIMEOUT: "10000"
    THROTTLE_TTL: "60000"
    THROTTLE_LIMIT: "10"
    DATABASE_POOL_SIZE: "10"
    LOG_LEVEL: "info"

  # -- Observability configuration.
  # Farm emits OpenTelemetry traces and Pyroscope profiles, and proxies queries
  # to Grafana/Prometheus/Tempo/Loki through the API. All values are optional.
  observability:
    # OpenTelemetry (OTLP traces)
    otelEnabled: false
    otelExporterEndpoint: ""    # e.g. http://alloy.monitoring.svc:4318/v1/traces
    otelServiceName: farm-api
    # Pyroscope continuous profiling
    pyroscopeEnabled: false
    pyroscopeServerAddress: ""  # e.g. http://pyroscope.monitoring.svc:4040
    # Backend proxy URLs (used by the API to forward observability queries)
    grafanaUrl: ""              # e.g. http://grafana.monitoring.svc:3000
    prometheusUrl: ""           # e.g. http://prometheus-operated.monitoring.svc:9090
    tempoUrl: ""                # e.g. http://tempo.monitoring.svc:3200
    lokiUrl: ""                 # e.g. http://loki.monitoring.svc:3100

  # -- Sensitive environment variables injected via a Kubernetes Secret.
  # In production always use existingSecret — never set real values here.
  # DATABASE_PASSWORD is sourced from postgresql.auth.password or
  # externalDatabase.password depending on which backend is active.
  secrets:
    # Required. Minimum 32 characters in production.
    JWT_SECRET: "change-me-this-must-be-at-least-32-characters-long"
    # Optional integrations — set to a non-null value only when the
    # integration is enabled. Null fields are omitted from the Secret.
    SMTP_PASS: ~
    GITHUB_CLIENT_SECRET: ~
    GOOGLE_CLIENT_SECRET: ~
    KEYCLOAK_CLIENT_SECRET: ~
    LDAP_BIND_PASSWORD: ~
    IAC_INGEST_TOKEN: ~
    SWAGGER_PASSWORD: ~

  # -- When set, skip creating the Secret and reference this existing Secret
  # by name for all sensitive env vars. Recommended for GitOps (External
  # Secrets Operator, Sealed Secrets, etc.).
  existingSecret: ""

  # -- External Secrets Operator (ESO) integration.
  # When enabled, renders an ExternalSecret resource that syncs secrets from
  # a configured secret store into a Kubernetes Secret consumed by the API pod.
  # Requires the External Secrets Operator CRD to be installed in the cluster.
  # See https://external-secrets.io for installation instructions.
  externalSecret:
    enabled: false
    secretStoreRef:
      name: ""
      kind: SecretStore
    remoteRef:
      # -- Key in the remote secret store (e.g., AWS Secrets Manager secret name,
      # Vault path, GCP Secret Manager resource name).
      key: ""

  # ─── HPA ──────────────────────────────────────────────────────────────────

  autoscaling:
    enabled: false
    minReplicas: 1
    # -- Connection pool ceiling: maxReplicas * DATABASE_POOL_SIZE must not exceed
    # PostgreSQL max_connections (default: 100).
    # Example: maxReplicas=10, DATABASE_POOL_SIZE=10 => 100 connections (at ceiling).
    # Reduce DATABASE_POOL_SIZE or use PgBouncer (transaction mode) for larger fleets.
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    # targetMemoryUtilizationPercentage: 80
    # -- HPA scale behavior. Controls scale-up and scale-down stabilization.
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Replicas
            value: 1
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Replicas
            value: 2
            periodSeconds: 60

  # ─── PDB ──────────────────────────────────────────────────────────────────

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # -- Node selector for the API pod.
  nodeSelector: {}

  # -- Tolerations for the API pod.
  tolerations: []

  # -- Affinity rules for the API pod.
  affinity: {}

  # -- topologySpreadConstraints for the API pod.
  # Example for zone distribution (enable in your operator values file):
  # topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: topology.kubernetes.io/zone
  #     whenUnsatisfiable: DoNotSchedule
  #     labelSelector:
  #       matchLabels:
  #         app.kubernetes.io/component: api
  topologySpreadConstraints: []

  # -- NetworkPolicy configuration for the API pod.
  networkPolicy:
    # -- Enable NetworkPolicy for the API pod (requires a CNI that supports NetworkPolicy).
    enabled: false
    # -- Set to true to confirm your CNI enforces NetworkPolicy (Calico, Cilium, Canal, Weave Net).
    # Flannel silently ignores NetworkPolicy resources without error. Setting this to true
    # suppresses the Helm validation warning emitted when networkPolicy.enabled=true.
    cniConfirmed: false
    # -- Namespace selector for the Ingress controller pod (used to allow ingress traffic).
    ingressControllerNamespaceSelector: {}
    # -- Pod selector for the Ingress controller pod.
    ingressControllerPodSelector: {}
    # -- Additional egress rules appended to the default set (DNS, HTTPS, DB, Redis).
    # Use this to allow custom ports (e.g., gRPC, SMTP, custom webhooks).
    # Example: [{ ports: [{ protocol: TCP, port: 587 }] }]
    additionalEgressRules: []
    # -- NetworkPolicyPeer entries used as the `to:` selector for the database
    # egress rule when postgresql.enabled is false. When empty, the egress rule
    # is rendered with an empty peer list (no destinations matched), so external
    # DB connectivity must be allowed via this field.
    # Example (RDS via CIDR):
    #   externalDatabaseEgress:
    #     - ipBlock:
    #         cidr: 10.0.0.0/16
    externalDatabaseEgress: []
    # -- NetworkPolicyPeer entries used as the `to:` selector for the Redis
    # egress rule when redis.enabled is false. Same semantics as
    # externalDatabaseEgress.
    externalRedisEgress: []

# ─── WEB ─────────────────────────────────────────────────────────────────────

web:
  # -- Number of web replicas (overrides global replicaCount).
  replicaCount: 1

  # -- Deployment rolling update strategy.
  # maxUnavailable: 0 ensures the old pod stays up until the new pod is ready.
  # Use replicaCount >= 2 for true zero-downtime rolling updates.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # -- Minimum seconds a pod must be Ready before it is considered available.
  minReadySeconds: 10

  # -- Container image configuration for the web service.
  image:
    # -- Container registry. Combined with repository: <registry>/<repository>:<tag>.
    registry: ""
    # -- Image repository.
    repository: ops-talks/farm-web
    # -- Image tag. Defaults to .Chart.AppVersion when empty.
    tag: ""
    # -- Image pull policy.
    pullPolicy: IfNotPresent

  # -- Image pull secrets specific to the web pod.
  imagePullSecrets: []

  serviceAccount:
    # -- Create a dedicated ServiceAccount for the web pod.
    create: true
    # -- Cloud workload identity annotations (provider-specific, set by operator):
    #   EKS IRSA:             eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>
    #   GKE Workload Identity: iam.gke.io/service-account: <gsa>@<project>.iam.gserviceaccount.com
    #   AKS Pod Identity:     azure.workload.identity/client-id: <client-id>
    annotations: {}
    # -- Override the generated ServiceAccount name.
    name: ""
    # -- Controls automountServiceAccountToken on the ServiceAccount resource.
    # Set to true when using workload identity mechanisms that require the
    # default service account token to be projected into the pod.
    automountServiceAccountToken: false

  # -- Annotations added to the web Deployment pod template.
  podAnnotations: {}
  # -- Labels added to the web Deployment pod template.
  podLabels: {}

  # -- Security context applied at the pod level.
  podSecurityContext:
    fsGroup: 1001

  # -- Security context applied to the web container.
  # UID 1001 matches the `nextjs` user baked into apps/web/Dockerfile (see FARM-S540).
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # -- Kubernetes Service configuration for the web pod.
  service:
    type: ClusterIP
    port: 3001

  # -- CPU and memory resource requests/limits.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Liveness probe configuration.
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Readiness probe configuration.
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Startup probe configuration. Runs before liveness/readiness; prevents
  # premature restarts during slow cold starts (e.g., Next.js compilation).
  startupProbe:
    httpGet:
      path: /api/health
      port: 3001
    failureThreshold: 20
    periodSeconds: 5

  # -- Extra environment variables injected directly into the container.
  extraEnv: []

  # -- Extra volumes for the web pod (e.g., emptyDir for /tmp when readOnlyRootFilesystem is true).
  extraVolumes: []
  # - name: tmp
  #   emptyDir: {}

  # -- Extra volume mounts for the web container.
  extraVolumeMounts: []
  # - name: tmp
  #   mountPath: /tmp

  # -- Seconds Kubernetes waits after SIGTERM before sending SIGKILL.
  terminationGracePeriodSeconds: 30

  # -- Container lifecycle hooks.
  # The preStop sleep allows kube-proxy to finish draining in-flight connections
  # before SIGTERM is sent to the application process.
  lifecycle:
    preStop:
      exec:
        command: ["sleep", "5"]

  # -- Web application environment (non-sensitive).
  env:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    # Internal URL used by Next.js server components to reach the API pod.
    # Typically the in-cluster ClusterIP service address.
    API_INTERNAL_URL: ""   # e.g. http://farm-api:3000/api — auto-set if empty
    # Public URL exposed to the browser.
    NEXT_PUBLIC_API_URL: ""
    NEXT_PUBLIC_WS_URL: ""

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    # -- HPA scale behavior. Controls scale-up and scale-down stabilization.
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Replicas
            value: 1
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Replicas
            value: 2
            periodSeconds: 60

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- topologySpreadConstraints for the web pod.
  # Example for zone distribution (enable in your operator values file):
  # topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: topology.kubernetes.io/zone
  #     whenUnsatisfiable: DoNotSchedule
  #     labelSelector:
  #       matchLabels:
  #         app.kubernetes.io/component: web
  topologySpreadConstraints: []

  # -- NetworkPolicy configuration for the web pod.
  networkPolicy:
    enabled: false
    # -- Set to true to confirm your CNI enforces NetworkPolicy (Calico, Cilium, Canal, Weave Net).
    # Flannel silently ignores NetworkPolicy resources without error. Setting this to true
    # suppresses the Helm validation warning emitted when networkPolicy.enabled=true.
    cniConfirmed: false
    ingressControllerNamespaceSelector: {}
    ingressControllerPodSelector: {}
    # -- Additional egress rules appended to the default set (DNS, HTTPS, API).
    # Example: [{ ports: [{ protocol: TCP, port: 3100 }] }]
    additionalEgressRules: []

# ─── INGRESS ─────────────────────────────────────────────────────────────────

ingress:
  enabled: false
  # -- Ingress class name (e.g., "nginx", "traefik", "alb").
  className: ""
  # -- Annotations for the Ingress resource.
  # Examples:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  #   cert-manager.io/cluster-issuer: "letsencrypt-prod"
  annotations: {}
  # -- Hostname and path for the api service.
  api:
    hostname: farm-api.example.com
    path: /
    pathType: Prefix
    # -- Annotations specific to the API Ingress resource.
    # Merged with (and overrides) ingress.annotations for the API Ingress.
    annotations: {}
  # -- Hostname and path for the web service.
  web:
    hostname: farm.example.com
    path: /
    pathType: Prefix
    # -- Annotations specific to the web Ingress resource.
    # Merged with (and overrides) ingress.annotations for the web Ingress.
    annotations: {}
  # -- TLS configuration.
  tls: []
  # - secretName: farm-tls
  #   hosts:
  #     - farm.example.com
  #     - farm-api.example.com

# ─── MIGRATION ───────────────────────────────────────────────────────────────

migration:
  # -- Enable the pre-upgrade/pre-install migration Job.
  enabled: true
  # -- Restart policy for the migration Job pod.
  restartPolicy: OnFailure
  # -- Backoff limit before the Job is considered failed.
  backoffLimit: 3
  # -- Maximum duration in seconds before the Job is terminated.
  activeDeadlineSeconds: 300
  # -- Resources for the migration Job pod.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- Additional annotations on the migration Job pod template.
  podAnnotations: {}
  # -- initContainer that waits for the database TCP port to be reachable
  # before the migration container starts. Uses busybox nc (netcat) for a
  # lightweight TCP check compatible with air-gapped and KinD environments.
  waitForDb:
    # -- Enable the wait-for-db initContainer. Disable in dev/KinD environments
    # where the job backoffLimit is sufficient to handle the PostgreSQL startup race.
    enabled: true
    # -- Image for the wait-for-db initContainer (busybox with nc/netcat).
    # Pin to a digest in production: busybox:1.36@sha256:<digest>
    # Refresh via Renovate or: docker buildx imagetools inspect busybox:1.36
    image: busybox:1.36
    # -- Maximum number of attempts to reach the database before giving up.
    # With the default intervalSeconds=2, retries=60 yields a ~2 minute budget,
    # well under the typical activeDeadlineSeconds of the Job.
    retries: 60
    # -- Seconds between TCP probe attempts.
    intervalSeconds: 2

  # -- Pre-upgrade database reachability check Job.
  # Runs as a pre-upgrade hook at weight -20 (before the migration at weight -1).
  # If the database is unreachable the upgrade aborts before the migration starts,
  # preventing the migration Job from hanging for activeDeadlineSeconds.
  # Only fires on helm upgrade, not on initial install.
  preUpgradeCheck:
    enabled: false

# ─── EXTERNAL DATABASE ───────────────────────────────────────────────────────
# Used when postgresql.enabled is false (production default).

externalDatabase:
  # -- Hostname or FQDN of the external PostgreSQL server.
  # Must be explicitly set when postgresql.enabled is false.
  # "localhost" is never correct inside Kubernetes — set this to the actual
  # database hostname (e.g. an RDS endpoint or a ClusterIP service name).
  host: ""
  port: 5432
  user: "postgres"
  # -- Do NOT set this in values files. Provide via existingSecret or --set at
  # install time. Null means the field is omitted from the rendered Secret.
  password: ~
  name: "farm"
  # -- Reference an existing Kubernetes Secret for the DB password.
  # The Secret must contain a key named "database-password".
  existingSecret: ""
  existingSecretKey: "database-password"

# ─── EXTERNAL REDIS ──────────────────────────────────────────────────────────
# Used when redis.enabled is false (production default).

externalRedis:
  host: "localhost"
  port: 6379
  # -- Do NOT set this in values files. Provide via existingSecret or --set.
  # Null means Redis auth is not configured (unauthenticated Redis).
  password: ~
  existingSecret: ""
  existingSecretKey: "redis-password"

# ─── BITNAMI POSTGRESQL SUBCHART ─────────────────────────────────────────────
# Only deployed when postgresql.enabled is true (suitable for dev/staging).
# Full parameter reference: https://github.com/bitnami/charts/tree/main/bitnami/postgresql
#
# REGISTRY NOTE: Bitnami images are hosted on Docker Hub (docker.io/bitnami/*).
# Docker Hub rate-limits unauthenticated pulls (100 pulls/6h per IP for anonymous
# clients). In air-gapped or rate-limited environments, mirror Bitnami images and
# set postgresql.global.imageRegistry to your mirror host:
#   ECR Public mirror:   public.ecr.aws/bitnami
#   Corporate Harbor:    harbor.corp.example.com/bitnami-mirror
# Leave empty to pull directly from Docker Hub (requires valid credentials in
# imagePullSecrets or a pre-configured node-level credential store).

postgresql:
  enabled: false
  global:
    # -- Registry mirror for Bitnami images. Empty string uses Docker Hub.
    imageRegistry: ""
  auth:
    username: postgres
    # -- Set this value only in overlay files (values-dev.yaml, --set flag).
    # Never commit a real password here.
    password: ~
    database: farm
  primary:
    persistence:
      enabled: true
      size: 8Gi
      # -- StorageClass for the PostgreSQL PVC.
      # Empty string uses the cluster default StorageClass.
      storageClass: ""

# ─── BITNAMI REDIS SUBCHART ──────────────────────────────────────────────────
# Only deployed when redis.enabled is true (suitable for dev/staging).
# Full parameter reference: https://github.com/bitnami/charts/tree/main/bitnami/redis
#
# REGISTRY NOTE: Bitnami images are hosted on Docker Hub. See the PostgreSQL
# section above for registry mirror guidance.

redis:
  enabled: false
  global:
    # -- Registry mirror for Bitnami images. Empty string uses Docker Hub.
    imageRegistry: ""
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 2Gi
      # -- StorageClass for the Redis PVC.
      # Empty string uses the cluster default StorageClass.
      storageClass: ""

# ─── PROMETHEUS OPERATOR INTEGRATION ─────────────────────────────────────────
# Requires kube-prometheus-stack (or prometheus-operator) to be installed.

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor to scrape the API /metrics endpoint.
  enabled: false
  # -- Namespace to create the ServiceMonitor in. Defaults to the release namespace.
  namespace: ""
  # -- Labels added to the ServiceMonitor (must match the Prometheus operator's serviceMonitorSelector).
  # Example for kube-prometheus-stack default: release: kube-prometheus-stack
  additionalLabels: {}
  interval: 30s
  scrapeTimeout: 10s
  # -- Path to the metrics endpoint.
  path: /api/metrics
  # -- Scheme (http or https).
  scheme: http

prometheusRule:
  # -- Create a Prometheus Operator PrometheusRule with the Farm alert rules.
  enabled: false
  # -- Namespace to create the PrometheusRule in. Defaults to the release namespace.
  namespace: ""
  # -- Labels added to the PrometheusRule (must match the Prometheus operator's ruleNamespaceSelector/ruleSelector).
  additionalLabels: {}
  # -- Base URL for alert runbooks. Appended with #alert-name-slug.
  runbookBaseUrl: "https://github.com/Ops-Talks/farm/blob/main/docs/runbooks/alerts.md"

# ─── GRAFANA DASHBOARDS ───────────────────────────────────────────────────────
# Packages the Farm Grafana dashboards as ConfigMaps with the grafana_dashboard: "1"
# label for automatic discovery by the Grafana sidecar in kube-prometheus-stack.

grafanaDashboards:
  # -- Create ConfigMaps for all 6 Farm Grafana dashboards.
  enabled: false
  # -- Namespace to create the ConfigMaps in. Defaults to the release namespace.
  # Set to the namespace where Grafana is installed (e.g., monitoring) for auto-import.
  namespace: ""
  # -- Label key used by the Grafana sidecar to discover dashboards.
  labelKey: grafana_dashboard
  # -- Label value used by the Grafana sidecar to discover dashboards.
  labelValue: "1"
  # -- Grafana folder to import dashboards into.
  folder: Farm

