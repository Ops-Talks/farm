# Default values for the Farm Helm chart.
# Override any value with -f my-values.yaml or --set key=value.

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full release name used in resource names.
fullnameOverride: ""

ingress:
  # -- Enable Ingress resources for API and web.
  enabled: false
  # -- IngressClass name. Use the name of your Ingress controller (e.g. "nginx", "traefik").
  className: ""
  # -- Additional annotations to add to both Ingress resources.
  annotations: {}
  # -- API Ingress hostname.
  api:
    hostname: "api.example.com"
  # -- Web Ingress hostname.
  web:
    hostname: "app.example.com"
  tls:
    # -- Enable TLS on the Ingress resources.
    enabled: false
    # -- TLS secret name. Defaults to "<fullname>-api-tls" and "<fullname>-web-tls" if empty.
    secretName: ""

# -- Global image settings. Individual overrides are available under api.image and web.image.
global:
  # -- Container registry prefix applied to both images when set.
  # Example: "ghcr.io/ops-talks" — leave empty to use image.repository as-is.
  imageRegistry: ""
  # -- Global image pull secrets applied to all pods.
  imagePullSecrets: []

# ─── API ────────────────────────────────────────────────────────────[...]

api:
  # -- Number of API replicas.
  # Production default is 2 to eliminate the single-point-of-failure risk and
  # to satisfy the PodDisruptionBudget (minAvailable: 1) during node drains.
  # Override to 1 only in resource-constrained environments (e.g. values-dev.yaml).
  replicaCount: 2

  image:
    # -- Container registry. Combined with repository: <registry>/<repository>:<tag>.
    registry: ""
    repository: ops-talks/farm-api
    tag: ""   # defaults to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent

  # -- Image pull secrets specific to the API pod.
  imagePullSecrets: []

  serviceAccount:
    # -- Create a dedicated ServiceAccount for the API pod.
    create: true
    # -- Annotations to add (e.g., for IRSA or Workload Identity).
    annotations: {}
    # -- Override the generated ServiceAccount name.
    name: ""

  # -- Annotations added to the API Deployment pod template.
  podAnnotations: {}

  # -- Labels added to the API Deployment pod template.
  podLabels: {}

  # -- Security context applied at the pod level.
  podSecurityContext:
    fsGroup: 1001

  # -- Security context applied to the API container.
  # UID 1001 matches the `farmapi` user baked into apps/api/Dockerfile and the
  # `nextjs` user in apps/web/Dockerfile (see FARM-S540).
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 3000

  # -- CPU and memory resource requests/limits.
  # Sized per the Farm SRE resource table (see deploy/helm/farm/README.md).
  # Adjust limits based on actual usage observed via Prometheus
  # container_cpu_usage_seconds_total and container_memory_working_set_bytes.
  # cpu request: 250m covers normal NestJS event-loop + DB query load.
  # memory limit: 512Mi covers heap + external buffers; alert fires at 80% heap.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # -- Liveness probe configuration.
  # Kubernetes probes use httpGet (the idiomatic form) rather than the
  # shared apps/api/scripts/healthcheck.js node script that the Dockerfile
  # HEALTHCHECK and docker-compose use. Both ultimately hit the same
  # /api/health endpoint, so the SLI is consistent across environments.
  # Override with `exec.command: ["node", "scripts/healthcheck.js"]` if
  # consolidation is required for a specific cluster (see FARM-S541).
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Readiness probe configuration. See `livenessProbe` for the rationale
  # behind keeping httpGet instead of exec'ing the shared healthcheck script.
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Startup probe configuration. Runs before liveness/readiness; prevents
  # premature restarts during slow cold starts.
  startupProbe:
    httpGet:
      path: /api/health
      port: 3000
    failureThreshold: 20
    periodSeconds: 5

  # -- Init container that waits for the database to accept TCP connections
  # before starting the NestJS process.
  #
  # Why this is needed: TypeORM's default retry budget is 10 attempts x 3 s =
  # 30 seconds. The Bitnami PostgreSQL subchart takes 30-90 s to become ready
  # on a KinD cluster. Without this guard the API process crashes while the DB
  # is still initialising, enters CrashLoopBackOff, and ct install times out.
  #
  # Auto-enable logic (see deployment template): the init container is active
  # when THIS field is true OR when postgresql.enabled is true. Set enabled=true
  # explicitly when using an external database that may be transiently
  # unreachable at pod start time (e.g. RDS during a failover).
  waitForDb:
    # -- Enable the wait-for-db init container.
    # Automatically activated by the deployment template when postgresql.enabled
    # is true; set this to true to force-enable it for external databases.
    enabled: false
    # -- Image used for the TCP probe. Must ship nc (netcat via busybox).
    # Pinned by digest to satisfy FARM-S538 (mutable tag prohibition).
    # Refresh the digest via Renovate or manually when a CVE requires it.
    image: "busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
    # -- Maximum number of TCP probe attempts before aborting startup.
    # With intervalSeconds=2 and retries=60 the budget is approximately
    # 2 minutes — enough for Bitnami PostgreSQL to initialise on KinD.
    retries: 60
    # -- Seconds between TCP probe attempts.
    intervalSeconds: 2
    # -- Resource requests/limits for the wait-for-db init container.
    # Kept deliberately small: the container only runs nc in a loop.
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi

  # -- Extra environment variables injected directly into the container.
  # These supplement (and override) the values generated from api.env below.
  extraEnv: []
  # - name: SOME_VAR
  #   value: "some-value"

  # -- Extra volumes for the API pod.
  # The catalog, documentation, and iac modules write temporary files to os.tmpdir().
  # With readOnlyRootFilesystem: true (the default), /tmp must be a writable emptyDir.
  extraVolumes:
    - name: tmp
      emptyDir: {}

  # -- Extra volume mounts for the API container.
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  # -- Application environment configuration (non-sensitive).
  # All values end up in a ConfigMap and are injected via envFrom.
  env:
    NODE_ENV: production
    DATABASE_SYNC: "false"
    CACHE_TTL: "30"
    ALLOWED_ORIGINS: ""
    SWAGGER_USER: "farm"
    PLUGINS_DIR: ./plugins
    REDIS_SENTINEL_HOSTS: ""
    REDIS_SENTINEL_NAME: "mymaster"
    DATABASE_POOL_CONNECT_TIMEOUT: "5000"
    DATABASE_STATEMENT_TIMEOUT: "30000"
    DATABASE_POOL_IDLE_TIMEOUT: "10000"
    THROTTLE_TTL: "60000"
    THROTTLE_LIMIT: "10"
    DATABASE_POOL_SIZE: "10"
    LOG_LEVEL: "info"

  # -- Observability configuration.
  # Farm proxies queries to Grafana/Prometheus/Tempo/Loki through the API.
  # All values are optional. Tracing and profiling are now in top-level blocks.
  observability:
    # Backend proxy URLs (used by the API to forward observability queries)
    grafanaUrl: ""              # e.g. http://grafana.monitoring.svc:3000
    prometheusUrl: ""           # e.g. http://prometheus-operated.monitoring.svc:9090
    tempoUrl: ""                # e.g. http://tempo.monitoring.svc:3200
    lokiUrl: ""                 # e.g. http://loki.monitoring.svc:3100

  # -- Sensitive environment variables injected via a Kubernetes Secret.
  # In production always use existingSecret — never set real values here.
  # DATABASE_PASSWORD is sourced from postgresql.auth.password or
  # externalDatabase.password depending on which backend is active.
  secrets:
    # Required. Minimum 32 characters in production.
    JWT_SECRET: "change-me-this-must-be-at-least-32-characters-long"
    # Optional integrations — set to a non-null value only when the
    # integration is enabled. Null fields are omitted from the Secret.
    SMTP_PASS: ~
    GITHUB_CLIENT_SECRET: ~
    GOOGLE_CLIENT_SECRET: ~
    KEYCLOAK_CLIENT_SECRET: ~
    LDAP_BIND_PASSWORD: ~
    IAC_INGEST_TOKEN: ~
    SWAGGER_PASSWORD: ~

  # -- When set, skip creating the Secret and reference this existing Secret
  # by name for all sensitive env vars. Recommended for GitOps (External
  # Secrets Operator, Sealed Secrets, etc.).
  existingSecret: ""

  # ─── HPA ───────────────────────────────────────────────────────────[...]

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    # targetMemoryUtilizationPercentage: 80
    # -- HPA scale behavior. Controls scale-up and scale-down stabilization.
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Replicas
            value: 1
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Replicas
            value: 2
            periodSeconds: 60

  # ─── PDB ───────────────────────────────────────────────────────────[...]
  # PDB is enabled by default to prevent node-drain operations from removing
  # all API pods simultaneously. The template only creates the object when
  # replicaCount > 1, so enabling it in single-replica environments (dev) is
  # harmless — the PodDisruptionBudget resource will simply not be rendered.

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # -- Node selector for the API pod.
  nodeSelector: {}

  # -- Tolerations for the API pod.
  tolerations: []

  # -- Affinity rules for the API pod.
  affinity: {}

  # -- topologySpreadConstraints for the API pod.
  # Example for zone distribution (enable in values-production.yaml):
  # topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: topology.kubernetes.io/zone
  #     whenUnsatisfiable: DoNotSchedule
  #     labelSelector:
  #       matchLabels:
  #         app.kubernetes.io/component: api
  topologySpreadConstraints: []

  # -- NetworkPolicy configuration for the API pod.
  networkPolicy:
    # -- Enable NetworkPolicy for the API pod (requires a CNI that supports NetworkPolicy).
    enabled: false
    # -- Namespace selector for the Ingress controller pod (used to allow ingress traffic).
    ingressControllerNamespaceSelector: {}
    # -- Pod selector for the Ingress controller pod.
    ingressControllerPodSelector: {}
    # -- NetworkPolicyPeer entries for the database egress rule when postgresql.enabled is false
    # and externalDatabase.egressIpBlock is empty. When also empty, DB egress is denied.
    # Example (RDS via CIDR): [{ ipBlock: { cidr: "10.0.0.0/16" } }]
    externalDatabaseEgress: []
    # -- NetworkPolicyPeer entries for the Redis egress rule when redis.enabled is false
    # and externalRedis.egressIpBlock is empty.
    externalRedisEgress: []
    # -- Additional egress rules appended verbatim. Use to open custom ports (gRPC, SMTP, etc.).
    # Example: [{ ports: [{ protocol: TCP, port: 587 }] }]
    additionalEgressRules: []

# ─── WEB ───────────────────────────────────────────────────────────██[...]

web:
  # -- Number of web replicas.
  # Production default is 2 — same HA rationale as api.replicaCount.
  # Override to 1 in resource-constrained environments (e.g. values-dev.yaml).
  replicaCount: 2

  image:
    registry: ""
    repository: ops-talks/farm-web
    tag: ""   # defaults to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    fsGroup: 1001

  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 3001

  # -- CPU and memory resource requests/limits for the web (Next.js) container.
  # cpu request: 100m covers SSR + static serving at moderate traffic.
  # memory limit: 256Mi covers Next.js runtime; raise if ISR cache grows large.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # -- Liveness probe configuration.
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /api/health
      port: 3001
    failureThreshold: 20
    periodSeconds: 5

  extraEnv: []

  # -- Extra volumes for the web pod.
  # With readOnlyRootFilesystem: true (the default), /tmp must be a writable emptyDir.
  # Next.js standalone server may write to /tmp for ISR cache, image optimization, or
  # Node.js runtime operations.
  extraVolumes:
    - name: tmp
      emptyDir: {}

  # -- Extra volume mounts for the web container.
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  # -- Web application environment (non-sensitive).
  env:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    # Internal URL used by Next.js server components to reach the API pod.
    # Typically the in-cluster ClusterIP service address.
    API_INTERNAL_URL: ""   # e.g. http://farm-api:3000/api — auto-set if empty
    # Public URL exposed to the browser.
    NEXT_PUBLIC_API_URL: ""
    NEXT_PUBLIC_WS_URL: ""

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    # -- HPA scale behavior. Controls scale-up and scale-down stabilization.
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Replicas
            value: 1
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Replicas
            value: 2
            periodSeconds: 60

  podDisruptionBudget:
    # PDB is enabled by default — same HA rationale as api.podDisruptionBudget.
    # Template is a no-op when web.replicaCount < 2.
    enabled: true
    minAvailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- topologySpreadConstraints for the web pod.
  # Example for zone distribution (enable in values-production.yaml):
  # topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: topology.kubernetes.io/zone
  #     whenUnsatisfiable: DoNotSchedule
  #     labelSelector:
  #       matchLabels:
  #         app.kubernetes.io/component: web
  topologySpreadConstraints: []

  # -- NetworkPolicy configuration for the web pod.
  networkPolicy:
    enabled: false
    ingressControllerNamespaceSelector: {}
    ingressControllerPodSelector: {}

# ─── MIGRATION ─────────────────────────────────────────────────────────██[...]

migration:
  # -- Enable the pre-upgrade/pre-install migration Job.
  enabled: true
  # -- Restart policy for the migration Job pod.
  restartPolicy: OnFailure
  # -- Backoff limit before the Job is considered failed.
  backoffLimit: 3
  # -- Maximum duration in seconds before the Job is terminated.
  # Budget: waitForDb (retries × intervalSeconds ≈ 120s) + migration execution
  # (≈120s typical) + buffer. Set well below the helm-upgrade --timeout (10m)
  # so Helm reports a clean Job failure instead of hitting its context deadline.
  activeDeadlineSeconds: 480
  # -- Resources for the migration Job pod.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- Additional annotations on the migration Job pod template.
  podAnnotations: {}
  # -- Init container that waits for the database to be reachable before running migrations.
  waitForDb:
    enabled: true
    # -- Image used for the TCP probe. Must have `nc` (netcat) available.
    # Pinned by digest to satisfy the mutable tag prohibition (same as api.waitForDb.image).
    # Refresh via Renovate or manually when a CVE requires it.
    image: "busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
    # -- Maximum number of TCP probe attempts before giving up.
    # With intervalSeconds=2 and retries=60, the budget is ~2 minutes.
    retries: 60
    # -- Seconds between TCP probe attempts.
    intervalSeconds: 2
  # -- Pre-upgrade DB reachability check Job (runs at hook weight -20, before migration).
  preUpgradeCheck:
    enabled: true

# ─── SEED ────────────────────────────────────────────────────────────────────
# Runs the initial seed after a successful install (post-install hook).
# Disabled by default: seed data is for development/staging only.
# Enable with seed.enabled=true in overlay values (e.g. values-dev.yaml).
# The seed is idempotent — safe to re-run; existing records are skipped.

seed:
  # -- Enable the post-install seed Job.
  # Never enable in production (real data would be mixed with demo records).
  enabled: false
  # -- Restart policy for the seed Job pod.
  restartPolicy: OnFailure
  # -- Backoff limit before the Job is considered failed.
  backoffLimit: 3
  # -- Maximum duration in seconds before the Job is terminated.
  activeDeadlineSeconds: 300
  # -- Resources for the seed Job pod.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- Additional annotations on the seed Job pod template.
  podAnnotations: {}

# ─── BOOTSTRAP ───────────────────────────────────────────────────────────────
# Creates the first admin user on a fresh install (post-install hook, weight 2).
# Safe for production: only creates the user when it does not already exist.
# Disabled by default. Enable by setting bootstrap.admin.enabled=true and
# providing username, email, and password in overlay values or a Kubernetes
# Secret referenced via api.existingSecret (add ADMIN_PASSWORD manually).
#
# The bootstrap Job runs AFTER migration (weight -1) and seed (weight 1),
# so the users table is guaranteed to exist.

bootstrap:
  admin:
    # -- Enable the post-install bootstrap Job. Set to true to create the first admin.
    enabled: false
    # -- Admin username (required when enabled).
    username: ""
    # -- Admin email (required when enabled).
    email: ""
    # -- Admin password in plain text (required when enabled; stored hashed in DB).
    password: ""
    # -- Organization name to create and enroll the admin as OWNER (optional).
    # Leave empty to skip organization creation. Idempotent: skips if org already exists.
    orgName: ""
    # -- Restart policy for the bootstrap Job pod.
    restartPolicy: OnFailure
    # -- Backoff limit before the Job is considered failed.
    backoffLimit: 3
    # -- Maximum duration in seconds before the Job is terminated.
    activeDeadlineSeconds: 180
    # -- Resources for the bootstrap Job pod.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # -- Additional annotations on the bootstrap Job pod template.
    podAnnotations: {}

# ─── EXTERNAL DATABASE ───────────────────────────────────────────────────────
# Used when postgresql.enabled is false (production default).

externalDatabase:
  # -- Hostname or IP of the external PostgreSQL instance.
  # REQUIRED when postgresql.enabled=false. Leaving this empty causes the
  # FARM-S583 guard to abort helm install/upgrade with a descriptive error.
  # Example: "rds-farm.c3abc123.us-east-1.rds.amazonaws.com"
  host: ""
  port: 5432
  user: "postgres"
  # -- Do NOT set this in values files. Provide via existingSecret or --set at
  # install time. Null means the field is omitted from the rendered Secret.
  password: ~
  name: "farm"
  # -- Reference an existing Kubernetes Secret for the DB password.
  # The Secret must contain a key named "database-password".
  existingSecret: ""
  existingSecretKey: "database-password"
  # -- CIDR block for the NetworkPolicy egress rule to the external database.
  # Convenience shorthand for api.networkPolicy.externalDatabaseEgress when the
  # external DB is reachable via a known IP range (e.g. RDS VPC CIDR).
  # Example: "10.0.0.0/16". Leave empty to use externalDatabaseEgress (full peer spec).
  egressIpBlock: ""

# ─── EXTERNAL REDIS ────────────────────────────────────────────────────────[...]
# Used when redis.enabled is false (production default).

externalRedis:
  host: ""
  port: 6379
  # -- Do NOT set this in values files. Provide via existingSecret or --set.
  # Null means Redis auth is not configured (unauthenticated Redis).
  password: ~
  existingSecret: ""
  existingSecretKey: "redis-password"
  # -- CIDR block for the NetworkPolicy egress rule to the external Redis.
  # Convenience shorthand for api.networkPolicy.externalRedisEgress.
  # Example: "10.0.0.0/16". Leave empty to use externalRedisEgress (full peer spec).
  egressIpBlock: ""

# ─── BITNAMI POSTGRESQL SUBCHART ─────────────────────────────────────────────
# Only deployed when postgresql.enabled is true (suitable for dev/staging).
# Full parameter reference: https://github.com/bitnami/charts/tree/main/bitnami/postgresql

postgresql:
  enabled: false
  auth:
    username: postgres
    # -- Set this value only in overlay files (values-dev.yaml, --set flag).
    # Never commit a real password here.
    password: ~
    database: farm
  primary:
    persistence:
      enabled: true
      size: 8Gi

# ─── BITNAMI REDIS SUBCHART ──────────────────────────────────────────────────
# Only deployed when redis.enabled is true (suitable for dev/staging).
# Full parameter reference: https://github.com/bitnami/charts/tree/main/bitnami/redis

redis:
  enabled: false
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 2Gi

# ─── PROMETHEUS OPERATOR INTEGRATION ─────────────────────────────────────────
# Requires kube-prometheus-stack (or prometheus-operator) to be installed.

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor to scrape the API /metrics endpoint.
  # Enabled by default: observability is opt-out in production, not opt-in.
  # Disable in environments that do not have prometheus-operator installed.
  enabled: true
  # -- Namespace to create the ServiceMonitor in. Defaults to the release namespace.
  namespace: ""
  # -- Labels added to the ServiceMonitor (must match the Prometheus operator's serviceMonitorSelector).
  # Example for kube-prometheus-stack default: release: kube-prometheus-stack
  additionalLabels: {}
  interval: 30s
  scrapeTimeout: 10s
  # -- Path to the metrics endpoint.
  path: /api/metrics
  # -- Scheme (http or https).
  scheme: http

prometheusRule:
  # -- Create a Prometheus Operator PrometheusRule with the Farm alert rules.
  # Enabled by default: observability is opt-out in production, not opt-in.
  # Disable in environments that do not have prometheus-operator installed.
  enabled: true
  # -- Namespace to create the PrometheusRule in. Defaults to the release namespace.
  namespace: ""
  # -- Labels added to the PrometheusRule (must match the Prometheus operator's ruleNamespaceSelector/ruleSelector).
  additionalLabels: {}
  # -- Base URL for alert runbooks. Appended with #alert-name-slug.
  runbookBaseUrl: "https://github.com/Ops-Talks/farm/blob/main/docs/runbooks/alerts.md"
  # -- Alertmanager receiver name used by the Farm alert routing rules.
  # REQUIRED when prometheusRule.enabled=true (FARM-S587).
  # Set to the name of a receiver defined in your Alertmanager configuration.
  # In production this is typically "pagerduty" or "slack-farm-alerts".
  # In dev/staging set to "null" (the built-in Alertmanager no-op receiver).
  # Leaving this empty will cause `helm template` / `helm install` to fail
  # deliberately — a null receiver silently swallows alerts, which is worse
  # than a loud deploy-time error.
  alertmanagerReceiverName: ""

# ─── GRAFANA DASHBOARDS ──────────────────────────────────────────────────────██[...]
# Packages the Farm Grafana dashboards as ConfigMaps with the grafana_dashboard: "1"
# label for automatic discovery by the Grafana sidecar in kube-prometheus-stack.

grafanaDashboards:
  # -- Create ConfigMaps for all 7 Farm Grafana dashboards.
  enabled: false
  # -- Namespace to create the ConfigMaps in. Defaults to the release namespace.
  # Set to the namespace where Grafana is installed (e.g., monitoring) for auto-import.
  namespace: ""
  # -- Label key used by the Grafana sidecar to discover dashboards.
  labelKey: grafana_dashboard
  # -- Label value used by the Grafana sidecar to discover dashboards.
  labelValue: "1"
  # -- Grafana folder to import dashboards into.
  folder: Farm

# ─── TRACING ──────────────────────────────────────────────────────────█[...]
# Requires an OpenTelemetry collector (Grafana Alloy, OpenTelemetry Collector, etc.)

tracing:
  # -- Enable OpenTelemetry trace export from the API.
  enabled: false
  # -- OTLP HTTP endpoint for the collector.
  endpoint: ""    # e.g. http://alloy.monitoring.svc:4318/v1/traces
  # -- Service name reported in traces.
  serviceName: farm-api

# ─── PYROSCOPE ─────────────────────────────────────────────────────────██[...]
# Requires Grafana Pyroscope or Grafana Cloud Profiles.

pyroscope:
  # -- Enable continuous profiling.
  enabled: false
  # -- Pyroscope server address.
  url: ""    # e.g. http://pyroscope.monitoring.svc:4040

# ─── FARO ───────────────────────────────────────────────────────────█[...]
# Requires Grafana Alloy with a Faro receiver, or Grafana Cloud Frontend Observability.

faro:
  # -- Enable Grafana Faro real-user monitoring (RUM) for the web frontend.
  enabled: false
  # -- Faro collector URL (injected as NEXT_PUBLIC_FARO_URL into the web pod).
  url: ""    # e.g. http://alloy.monitoring.svc:12347/collect
