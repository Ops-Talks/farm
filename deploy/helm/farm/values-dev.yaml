# values-dev.yaml
# Local/dev profile: bundled PostgreSQL + Redis, single replica, no TLS.
# Usage: helm install farm . -f values-dev.yaml

ingress:
  enabled: true
  className: "nginx"
  api:
    hostname: "api.farm.local"
  web:
    hostname: "farm.local"

api:
  replicaCount: 1
  image:
    repository: farm-api
    tag: ""
    pullPolicy: IfNotPresent
  env:
    NODE_ENV: development
    ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
  secrets:
    JWT_SECRET: "dev-jwt-secret-change-me-at-least-32-chars"
  # emptyDir mounts required when readOnlyRootFilesystem: true
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

web:
  replicaCount: 1
  image:
    repository: farm-web
    tag: ""
    pullPolicy: IfNotPresent
  env:
    NODE_ENV: development
    NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
    NEXT_PUBLIC_APP_URL: "http://localhost:3001"

migration:
  enabled: true

prometheusRule:
  # "null" is the built-in Alertmanager no-op receiver that discards all alerts.
  # This satisfies the FARM-S587 fail guard without routing alerts in dev.
  alertmanagerReceiverName: "null"

postgresql:
  enabled: true
  auth:
    username: farm
    # Keep in sync with the value used during `helm install`. Bitnami PostgreSQL
    # does NOT rotate the password on upgrade — it reuses the existing Secret.
    # If the cluster was re-created, use the same password here.
    password: farmci
    database: farm

redis:
  enabled: true
  auth:
    enabled: false

tracing:
  enabled: true
  endpoint: "http://alloy:4318/v1/traces"
  serviceName: farm-api

pyroscope:
  enabled: true
  url: "http://pyroscope:4040"

faro:
  enabled: true
  url: "http://alloy:12347/collect"

bootstrap:
  admin:
    enabled: true
    username: admin
    email: admin@farm.dev
    password: Admin1234
    orgName: "Farm Demo"

seed:
  enabled: true
