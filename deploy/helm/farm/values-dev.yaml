# values-dev.yaml
# Local/dev profile for KinD: standalone PostgreSQL + Redis pods deployed via
# deploy/helm/farm/kind-infra.yaml (Bitnami subcharts are disabled here because
# the Bitnami registry requires authentication since the 2024 migration).
#
# Usage:
#   kubectl apply -f deploy/helm/farm/kind-infra.yaml -n farm
#   helm install farm . -f values-dev.yaml -n farm

api:
  replicaCount: 1
  image:
    repository: farm-api
    tag: "latest"
    pullPolicy: IfNotPresent
  env:
    NODE_ENV: development
    DATABASE_SYNC: "false"
    ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
  secrets:
    JWT_SECRET: "dev-jwt-secret-change-me-at-least-32-chars"
  # emptyDir mounts required when readOnlyRootFilesystem: true
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

web:
  replicaCount: 1
  image:
    repository: farm-web
    tag: "latest"
    pullPolicy: IfNotPresent
  env:
    NODE_ENV: development
    NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
    NEXT_PUBLIC_APP_URL: "http://localhost:3001"

ingress:
  enabled: false

migration:
  enabled: true
  # With post-install hook, PostgreSQL is being created in parallel.
  # Disable waitForDb (avoids busybox multi-arch KinD issue) and rely on
  # backoffLimit retries to handle the PostgreSQL startup race (~30-60s).
  backoffLimit: 6
  waitForDb:
    enabled: false

postgresql:
  enabled: false

redis:
  enabled: false
  auth:
    enabled: false

# Point to standalone infra pods deployed via kind-infra.yaml
externalDatabase:
  host: farm-infra-postgres
  port: 5432
  user: farm
  password: farm
  name: farm

externalRedis:
  host: farm-infra-redis
  port: 6379
