apiVersion: v2
name: farm
description: Farm — open-source platform portal for managing software components, documentation, and team infrastructure.
# autoscaling/v2 HPA is GA in Kubernetes 1.26; this is the highest GA requirement of any resource the chart ships.
kubeVersion: ">=1.26.0-0"
type: application
version: 0.3.0
appVersion: "0.25.8"
home: https://github.com/Ops-Talks/farm
sources:
  - https://github.com/Ops-Talks/farm
keywords:
  - farm
  - platform
  - developer-portal
  - backstage
  - devops
maintainers:
  - name: Ops-Talks
    url: https://github.com/Ops-Talks

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Ops-Talks/farm
    - name: Support
      url: https://github.com/Ops-Talks/farm/issues
  artifacthub.io/images: |
    - name: farm-api
      image: ghcr.io/ops-talks/farm-api:0.25.8
      platforms:
        - linux/amd64
        - linux/arm64
    - name: farm-web
      image: ghcr.io/ops-talks/farm-web:0.25.8
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/changes: |
    - kind: added
      description: OCI chart distribution via GHCR with cosign keyless signing
    - kind: added
      description: Ingress templates for API and web with optional TLS
    - kind: fixed
      description: NetworkPolicy web deny-all silencioso com ingressControllerNamespaceSelector vazio
    - kind: fixed
      description: Deployment pod template usa labels completos incluindo helm.sh/chart
    - kind: fixed
      description: PDB guard considera autoscaling.minReplicas quando HPA esta ativo
    - kind: fixed
      description: externalRedis.host default alterado de localhost para string vazia com guard de validacao
    - kind: security
      description: Release workflow com SHA-pin em todas as actions do GitHub

dependencies:
  - name: postgresql
    version: "15.5.38"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.6.4"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
