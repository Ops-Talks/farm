apiVersion: v2
name: farm
description: Farm — open-source platform portal for managing software components, documentation, and team infrastructure.
# autoscaling/v2 HPA is GA in Kubernetes 1.26; this is the highest GA requirement of any resource the chart ships.
kubeVersion: ">=1.26.0-0"
type: application
version: 0.25.22
appVersion: "0.25.16"
home: https://github.com/Ops-Talks/farm
sources:
  - https://github.com/Ops-Talks/farm
keywords:
  - farm
  - platform
  - developer-portal
  - backstage
  - devops
maintainers:
  - name: Ops-Talks
    url: https://github.com/Ops-Talks

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Ops-Talks/farm
    - name: Support
      url: https://github.com/Ops-Talks/farm/issues
  artifacthub.io/images: |
    - name: farm-api
      image: ghcr.io/ops-talks/farm-api:0.25.16
      platforms:
        - linux/amd64
    - name: farm-web
      image: ghcr.io/ops-talks/farm-web:0.25.16
      platforms:
        - linux/amd64
  artifacthub.io/changes: |
    - kind: fixed
      description: "build-images: switch to linux/amd64 only; linux/arm64 build was failing due to missing Tailwind CSS oxide native bindings, preventing farm-web from ever being published to GHCR"
    - kind: fixed
      description: "release: align Helm chart version with app version on every release; bump-helm-chart-version.sh direct +1 patch replaced by explicit assignment to prevent chart/app version drift"

dependencies:
  - name: postgresql
    version: "18.6.10"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "25.5.3"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
