apiVersion: v2
name: farm
description: Farm — open-source platform portal for managing software components, documentation, and team infrastructure.
# autoscaling/v2 HPA is GA in Kubernetes 1.26; this is the highest GA requirement of any resource the chart ships.
kubeVersion: ">=1.26.0-0"
type: application
version: 0.3.10
appVersion: "0.25.9"
home: https://github.com/Ops-Talks/farm
sources:
  - https://github.com/Ops-Talks/farm
keywords:
  - farm
  - platform
  - developer-portal
  - backstage
  - devops
maintainers:
  - name: Ops-Talks
    url: https://github.com/Ops-Talks

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Ops-Talks/farm
    - name: Support
      url: https://github.com/Ops-Talks/farm/issues
  artifacthub.io/images: |
    - name: farm-api
      image: ghcr.io/ops-talks/farm-api:0.25.9
      platforms:
        - linux/amd64
        - linux/arm64
    - name: farm-web
      image: ghcr.io/ops-talks/farm-web:0.25.9
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/changes: |
    - kind: fixed
      description: "test-api-health, test-web-health: add runAsUser: 100 (curl_user UID) to curl containers; curlimages/curl uses a non-numeric username which conflicts with pod-level runAsNonRoot: true causing CreateContainerConfigError"
    - kind: fixed
      description: "test-web-health: change health check endpoint from / to /api/health to match the actual readiness probe used by the web deployment"
    - kind: fixed
      description: "test-db-redis: add runAsUser: 70 (postgres UID on alpine) and runAsUser: 999 (redis UID) to check-postgres and check-redis initContainers; non-numeric usernames conflict with pod-level runAsNonRoot: true"
    - kind: fixed
      description: "test-db-redis: add app.kubernetes.io/component: test-db-redis label to Job metadata and pod template for consistency with other test hooks"
    - kind: fixed
      description: "values.yaml: pin migration.waitForDb.image digest (busybox:1.36@sha256:73aaf...) to satisfy mutable tag prohibition; aligns with api.waitForDb.image policy"
    - kind: added
      description: Add wait-for-db init container to API deployment; prevents CrashLoopBackOff when postgresql.enabled=true and PostgreSQL subchart is slower to initialise than TypeORM retry budget (ct install fix)
    - kind: fixed
      description: Remove DailyRotateFile transports from API logger; production logs go to stdout only (12-factor, readOnlyRootFilesystem compatible)
    - kind: fixed
      description: Add /tmp emptyDir to default values.yaml; catalog, documentation, and iac modules write temporary files to os.tmpdir()
    - kind: fixed
      description: ci/kind-values.yaml disables migration and sets global.imageRegistry to fix ct install on KinD
    - kind: fixed
      description: ct install builds images from the current branch and pre-loads into KinD; no released image required
    - kind: fixed
      description: Test hook pods use generic chart labels with test-specific component to avoid matching service selectors
    - kind: fixed
      description: Test hook delete policy includes before-hook-creation so failed test Jobs are cleaned up before retrying
    - kind: added
      description: OCI chart distribution via GHCR with cosign keyless signing
    - kind: added
      description: Ingress templates for API and web with optional TLS
    - kind: fixed
      description: Web NetworkPolicy no longer silently denies all ingress when ingressControllerNamespaceSelector is empty; supports podSelector-only peers
    - kind: fixed
      description: Deployment pod template uses the full label set including helm.sh/chart
    - kind: fixed
      description: PDB guard accounts for autoscaling.minReplicas when HPA is enabled
    - kind: fixed
      description: externalRedis.host default changed from localhost to empty string with validation guard
    - kind: fixed
      description: "ci/kind-values.yaml: use api.image.registry and web.image.registry instead of global.imageRegistry; ghcr.io/bitnami/* requires Broadcom authentication, docker.io/bitnami/* is public"
    - kind: fixed
      description: "Upgrade Bitnami subcharts: postgresql 15.5.38 -> 18.6.10, redis 19.6.4 -> 25.5.3; previous pinned versions used image tags removed from Docker Hub, causing ImagePullBackOff on ct install"
    - kind: fixed
      description: "test-db-redis.yaml: add runAsUser: 65534 (nobody) to check-pass container; busybox has no USER set and conflicts with pod-level runAsNonRoot: true"

dependencies:
  - name: postgresql
    version: "18.6.10"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "25.5.3"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
