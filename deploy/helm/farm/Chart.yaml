apiVersion: v2
name: farm
description: Farm — open-source platform portal for managing software components, documentation, and team infrastructure.
# autoscaling/v2 HPA is GA in Kubernetes 1.26; this is the highest GA requirement of any resource the chart ships.
kubeVersion: ">=1.26.0-0"
type: application
version: 0.25.18
appVersion: "0.25.15"
home: https://github.com/Ops-Talks/farm
sources:
  - https://github.com/Ops-Talks/farm
keywords:
  - farm
  - platform
  - developer-portal
  - backstage
  - devops
maintainers:
  - name: Ops-Talks
    url: https://github.com/Ops-Talks

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Ops-Talks/farm
    - name: Support
      url: https://github.com/Ops-Talks/farm/issues
  artifacthub.io/images: |
    - name: farm-api
      image: ghcr.io/ops-talks/farm-api:0.25.15
      platforms:
        - linux/amd64
        - linux/arm64
    - name: farm-web
      image: ghcr.io/ops-talks/farm-web:0.25.15
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/changes: |
    - kind: added
      description: "bootstrap-job.yaml: post-install Job (weight 2) that creates the first admin user from ADMIN_USERNAME/ADMIN_EMAIL/ADMIN_PASSWORD; disabled by default (bootstrap.admin.enabled=false)"
    - kind: added
      description: "values.schema.json: added bootstrap.admin schema block"
    - kind: fixed
      description: "Migration hook changed from pre-install to post-install,pre-upgrade; pre-install fired before PostgreSQL subchart was ready, causing wait-for-db CrashLoopBackOff on fresh installs"
    - kind: changed
      description: "Phase 54: migration-job outer resources now use farm.migration.labels helper instead of farm.labels + inline component label"
    - kind: changed
      description: "Phase 54: removed dead farm.selectorLabels helper from _helpers.tpl; fields inlined directly into farm.labels"
    - kind: changed
      description: "Phase 54: release automation now bumps chart version independently via scripts/bump-helm-chart-version.sh (patch increment) instead of mirroring appVersion"

dependencies:
  - name: postgresql
    version: "18.6.10"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "25.5.3"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
