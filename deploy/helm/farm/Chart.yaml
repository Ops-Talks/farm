apiVersion: v2
name: farm
description: Farm — open-source platform portal for managing software components, documentation, and team infrastructure.
# autoscaling/v2 HPA is GA in Kubernetes 1.26; this is the highest GA requirement of any resource the chart ships.
kubeVersion: ">=1.26.0-0"
type: application
version: 0.25.13
appVersion: "0.25.13"
home: https://github.com/Ops-Talks/farm
sources:
  - https://github.com/Ops-Talks/farm
keywords:
  - farm
  - platform
  - developer-portal
  - backstage
  - devops
maintainers:
  - name: Ops-Talks
    url: https://github.com/Ops-Talks

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Ops-Talks/farm
    - name: Support
      url: https://github.com/Ops-Talks/farm/issues
  artifacthub.io/images: |
    - name: farm-api
      image: ghcr.io/ops-talks/farm-api:0.25.13
      platforms:
        - linux/amd64
        - linux/arm64
    - name: farm-web
      image: ghcr.io/ops-talks/farm-web:0.25.13
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/changes: |
    - kind: changed
      description: "v0.25.13: chart version now mirrors appVersion so each application release publishes a fresh Farm chart artifact"
    - kind: changed
      description: "v0.25.13: release automation now updates the embedded farm-api and farm-web image tags in Chart.yaml during the version bump"

dependencies:
  - name: postgresql
    version: "18.6.10"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "25.5.3"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
