apiVersion: v2
name: farm
description: Farm — open-source platform portal for managing software components, documentation, and team infrastructure.
# autoscaling/v2 HPA is GA in Kubernetes 1.26; this is the highest GA requirement of any resource the chart ships.
kubeVersion: ">=1.26.0-0"
type: application
version: 0.25.20
appVersion: "0.25.15"
home: https://github.com/Ops-Talks/farm
sources:
  - https://github.com/Ops-Talks/farm
keywords:
  - farm
  - platform
  - developer-portal
  - backstage
  - devops
maintainers:
  - name: Ops-Talks
    url: https://github.com/Ops-Talks

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Ops-Talks/farm
    - name: Support
      url: https://github.com/Ops-Talks/farm/issues
  artifacthub.io/images: |
    - name: farm-api
      image: ghcr.io/ops-talks/farm-api:0.25.15
      platforms:
        - linux/amd64
        - linux/arm64
    - name: farm-web
      image: ghcr.io/ops-talks/farm-web:0.25.15
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/changes: |
    - kind: fixed
      description: "values-dev.yaml: remove DATABASE_SYNC=true — MigrationLockService already runs pending migrations on startup via advisory lock; synchronize=true with PostgreSQL is unsafe outside test environments"
    - kind: added
      description: "api.kubernetes.inCluster: new opt-in flag (default false) — when true, automounts SA token and creates a read-only ClusterRole/ClusterRoleBinding for Kubernetes workload discovery (Argo Rollouts, Flux, KEDA, OLM, Helm releases)"
    - kind: fixed
      description: "KubernetesService: probe SA cert/token existence before loadFromCluster(); prevents recurring ERROR logs when automountServiceAccountToken=false; requires explicit KUBERNETES_IN_CLUSTER=true or KUBECONFIG_PATH to enable"

dependencies:
  - name: postgresql
    version: "18.6.10"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "25.5.3"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
