{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "farm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.api.hostname }}
    - host: {{ .Values.ingress.api.hostname | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.api.path | default "/" }}
            pathType: {{ .Values.ingress.api.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "farm.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
    {{- end }}
    {{- if .Values.ingress.web.hostname }}
    - host: {{ .Values.ingress.web.hostname | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.web.path | default "/" }}
            pathType: {{ .Values.ingress.web.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "farm.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
    {{- end }}
{{- end }}
