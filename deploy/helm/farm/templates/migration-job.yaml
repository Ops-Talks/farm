{{- if .Values.migration.enabled }}
# ── Hook weight -10: ConfigMap with the minimal DB connection vars ────────────
# Regular resources (postgresql subchart) are created before post-install hooks
# execute, so the database will be starting up when this ConfigMap is created.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "farm.fullname" . }}-migration-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  NODE_ENV: {{ .Values.api.env.NODE_ENV | quote }}
  DATABASE_TYPE: "postgres"
  DATABASE_HOST: {{ include "farm.databaseHost" . | quote }}
  DATABASE_PORT: {{ include "farm.databasePort" . | quote }}
  DATABASE_USER: {{ include "farm.databaseUser" . | quote }}
  DATABASE_NAME: {{ include "farm.databaseName" . | quote }}
  DATABASE_SYNC: "false"
---
# ── Hook weight -8: Secret with the DB password ──────────────────────────────
# Only created when the chart manages the secret itself:
#   - api.existingSecret is empty (no operator-provided API secret), AND
#   - externalDatabase.existingSecret is empty (no operator-provided DB secret).
# When either of those is set, the migration Job consumes the password from
# that Secret instead, so rendering an empty *-migration-secret would deploy
# an unused/empty credential Secret.
{{- if and (not .Values.api.existingSecret) (not .Values.externalDatabase.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "farm.fullname" . }}-migration-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-8"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  DATABASE_PASSWORD: {{ .Values.postgresql.auth.password | default "" | quote }}
  {{- else if .Values.externalDatabase.password }}
  DATABASE_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  {{- else }}
  DATABASE_PASSWORD: ""
  {{- end }}
---
{{- end }}
# ── Hook weight -5: ServiceAccount ───────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "farm.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: false
---
# ── Hook weight -1: Job ───────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "farm.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "farm.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
      {{- with .Values.migration.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: {{ .Values.migration.restartPolicy }}
      serviceAccountName: {{ include "farm.fullname" . }}-migration
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if .Values.migration.waitForDb.enabled }}
      initContainers:
        - name: wait-for-db
          image: {{ .Values.migration.waitForDb.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              RETRIES={{ .Values.migration.waitForDb.retries | default 60 }}
              INTERVAL={{ .Values.migration.waitForDb.intervalSeconds | default 2 }}
              i=0
              while [ $i -lt $RETRIES ]; do
                if nc -z "${DATABASE_HOST}" "${DATABASE_PORT:-5432}"; then
                  echo "Database reachable at ${DATABASE_HOST}:${DATABASE_PORT:-5432}"
                  exit 0
                fi
                echo "Attempt $((i+1))/${RETRIES}: waiting for database at ${DATABASE_HOST}:${DATABASE_PORT:-5432}..."
                sleep $INTERVAL
                i=$((i+1))
              done
              echo "ERROR: database at ${DATABASE_HOST}:${DATABASE_PORT:-5432} unreachable after ${RETRIES} attempts. Aborting migration." >&2
              exit 1
          envFrom:
            - configMapRef:
                name: {{ include "farm.fullname" . }}-migration-config
          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
      {{- end }}
      {{- include "farm.api.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: migration
          image: {{ include "farm.api.image" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          command: ["node", "/app/node_modules/.bin/typeorm", "migration:run", "-d", "dist/config/typeorm-cli.config.js"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: {{ include "farm.fullname" . }}-migration-config
            {{- if .Values.api.existingSecret }}
            - secretRef:
                name: {{ .Values.api.existingSecret }}
            {{- else if .Values.externalDatabase.existingSecret }}
            - secretRef:
                name: {{ .Values.externalDatabase.existingSecret }}
            {{- else }}
            - secretRef:
                name: {{ include "farm.fullname" . }}-migration-secret
            {{- end }}
{{- end }}
