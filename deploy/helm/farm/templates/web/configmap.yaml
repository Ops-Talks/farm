apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "farm.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.web.labels" . | nindent 4 }}
data:
  {{- range $key := (.Values.web.env | keys | sortAlpha) }}
  {{- $value := get $.Values.web.env $key }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
