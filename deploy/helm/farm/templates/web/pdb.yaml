{{- $effectiveReplicas := int .Values.web.replicaCount -}}
{{- if .Values.web.autoscaling.enabled -}}
  {{- $effectiveReplicas = int .Values.web.autoscaling.minReplicas -}}
{{- end -}}
{{- if and .Values.web.podDisruptionBudget.enabled (gt $effectiveReplicas 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "farm.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.web.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "farm.web.selectorLabels" . | nindent 6 }}
{{- end }}
