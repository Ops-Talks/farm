{{- if .Values.web.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "farm.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "farm.web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound traffic to the web service port.
    - ports:
        - protocol: TCP
          port: 3001
      {{- if or .Values.web.networkPolicy.ingressControllerNamespaceSelector .Values.web.networkPolicy.ingressControllerPodSelector }}
      from:
        -
          {{- with .Values.web.networkPolicy.ingressControllerNamespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.networkPolicy.ingressControllerPodSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow access to the API service
    - ports:
        - port: {{ .Values.api.service.port }}
      to:
        - podSelector:
            matchLabels:
              {{- include "farm.api.selectorLabels" . | nindent 14 }}
    # Allow HTTPS egress (for external calls if any)
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
