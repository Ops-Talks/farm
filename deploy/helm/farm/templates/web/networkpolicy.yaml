{{- if .Values.web.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "farm.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "farm.web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.web.networkPolicy.ingressControllerNamespaceSelector }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.web.networkPolicy.ingressControllerNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.web.networkPolicy.ingressControllerPodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 3001
    {{- end }}
  egress:
    # DNS resolution (required for Next.js server-side rendering)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # API service (server-side fetch from Next.js to NestJS)
    - to:
        - podSelector:
            matchLabels:
              {{- include "farm.api.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
    # Outbound HTTPS — CDN assets, external auth providers, etc.
    - ports:
        - protocol: TCP
          port: 443
    {{- with .Values.web.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
