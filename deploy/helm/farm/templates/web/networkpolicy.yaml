{{- if .Values.web.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "farm.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "farm.web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.web.networkPolicy.ingressControllerNamespaceSelector }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.web.networkPolicy.ingressControllerNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.web.networkPolicy.ingressControllerPodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 3001
    {{- end }}
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow access to the API service
    - ports:
        - port: {{ .Values.api.service.port }}
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
              {{- include "farm.selectorLabels" . | nindent 14 }}
    # Allow HTTPS egress (for external calls if any)
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
