apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "farm.fullname" . }}-test-db-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
    "helm.sh/hook-weight": "5"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "farm.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      initContainers:
        - name: check-postgres
          # renovate: datasource=docker depName=postgres
          image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
          imagePullPolicy: IfNotPresent
          command:
            - pg_isready
            - -h
            - {{ include "farm.databaseHost" . }}
            - -U
            - {{ include "farm.databaseUser" . }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
        - name: check-redis
          # renovate: datasource=docker depName=redis
          image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          imagePullPolicy: IfNotPresent
          command:
            - redis-cli
            - -h
            - {{ include "farm.redisHost" . }}
            - ping
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: check-pass
          # renovate: datasource=docker depName=busybox
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - echo all-checks-passed
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
