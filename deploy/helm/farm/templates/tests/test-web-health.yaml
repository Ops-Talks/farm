apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "farm.fullname" . }}-test-web-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.web.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "farm.web.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: curl
          # renovate: datasource=docker depName=curlimages/curl
          image: curlimages/curl:8.20.0@sha256:b3f1fb2a51d923260350d21b8654bbc607164a987e2f7c84a0ac199a67df812a
          imagePullPolicy: IfNotPresent
          command:
            - curl
            - -sf
            - http://{{ include "farm.fullname" . }}-web:{{ .Values.web.service.port }}/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
