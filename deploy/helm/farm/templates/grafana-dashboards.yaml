{{- if .Values.grafanaDashboards.enabled }}
{{- $fullName := include "farm.fullname" . }}
{{- $labels := include "farm.labels" . }}
{{- $namespace := default .Release.Namespace .Values.grafanaDashboards.namespace }}
{{- $labelKey := .Values.grafanaDashboards.labelKey }}
{{- $labelValue := .Values.grafanaDashboards.labelValue }}
{{- $folder := .Values.grafanaDashboards.folder }}
{{- $dashboards := list "farm-api" "farm-infra" "farm-integrations" "farm-logs" "farm-rum" "farm-slo" "farm-traces" }}
{{- range $dashboards }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-dashboard-{{ . }}
  namespace: {{ $namespace }}
  labels:
    {{- $labels | nindent 4 }}
    {{ $labelKey }}: {{ $labelValue | quote }}
    grafana_folder: {{ $folder | quote }}
data:
  {{ printf "%s.json" . }}: |
    {{- ($.Files.Get (printf "dashboards/%s.json" .)) | nindent 4 }}
{{- end }}
{{- end }}
