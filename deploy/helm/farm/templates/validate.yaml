{{- /*
  Release-time validation of required security-sensitive values.
  Runs during `helm install`, `helm upgrade`, and `helm template`.
*/ -}}
{{- if not .Values.api.existingSecret -}}
  {{- $jwtDefault := "change-me-this-must-be-at-least-32-characters-long" -}}
  {{- if not .Values.api.secrets.JWT_SECRET -}}
    {{- fail "SECURITY: api.secrets.JWT_SECRET is required when api.existingSecret is not set. Generate a strong random secret: openssl rand -hex 32" -}}
  {{- end -}}
  {{- if eq .Values.api.secrets.JWT_SECRET $jwtDefault -}}
    {{- fail "SECURITY: api.secrets.JWT_SECRET must be changed from the default placeholder. Generate a strong random secret: openssl rand -hex 32" -}}
  {{- end -}}
  {{- if .Values.postgresql.enabled -}}
    {{- if not .Values.postgresql.auth.password -}}
      {{- fail "SECURITY: postgresql.auth.password is required when postgresql.enabled is true and api.existingSecret is not set." -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- /*
  External database host guard.
  "localhost" and empty string are never valid inside Kubernetes when using an
  external database. Both will silently misconfigure the API ConfigMap.
  This guard is independent of api.existingSecret because the farm.databaseHost
  helper is consumed regardless of how DB credentials are supplied.
*/ -}}
{{- if not .Values.postgresql.enabled -}}
  {{- if or (not .Values.externalDatabase.host) (eq .Values.externalDatabase.host "localhost") -}}
    {{- fail "CONFIGURATION: externalDatabase.host must be set to a valid hostname when postgresql.enabled is false. 'localhost' is not a valid in-cluster address." -}}
  {{- end -}}
{{- end -}}
{{- /*
  External Redis host guard.
  Same rationale as the DB guard above: when the bundled Redis subchart is
  disabled, externalRedis.host must point to a real in-cluster service or FQDN.
*/ -}}
{{- if not .Values.redis.enabled -}}
  {{- if or (not .Values.externalRedis.host) (eq .Values.externalRedis.host "localhost") -}}
    {{- fail "CONFIGURATION: externalRedis.host must be set to a valid hostname when redis.enabled is false. 'localhost' is not a valid in-cluster address." -}}
  {{- end -}}
{{- end -}}
{{- /*
  NetworkPolicy + Ingress selector guard.
  When the API NetworkPolicy is enabled alongside an Ingress, traffic from the
  Ingress controller is blocked unless at least one of the namespace/pod
  selectors is configured. An unconfigured selector locks out all external
  HTTP traffic silently, which is harder to diagnose than a Helm failure.
*/ -}}
{{- if and .Values.api.networkPolicy.enabled .Values.ingress.enabled -}}
  {{- $hasNsSelector  := .Values.api.networkPolicy.ingressControllerNamespaceSelector -}}
  {{- $hasPodSelector := .Values.api.networkPolicy.ingressControllerPodSelector -}}
  {{- if not (or $hasNsSelector $hasPodSelector) -}}
    {{- fail "CONFIGURATION: api.networkPolicy.enabled=true and ingress.enabled=true but neither api.networkPolicy.ingressControllerNamespaceSelector nor api.networkPolicy.ingressControllerPodSelector is set. The NetworkPolicy will block all Ingress controller traffic. Set at least one selector, or disable api.networkPolicy.enabled." -}}
  {{- end -}}
{{- end -}}

{{- if and .Values.api.networkPolicy.enabled (not .Values.api.networkPolicy.cniConfirmed) -}}
  {{- fail "NetworkPolicy requires a CNI that enforces it (Calico, Cilium, Canal, Weave Net). Flannel silently ignores NetworkPolicy resources. Set networkPolicy.enabled=false if your CNI does not support it, or suppress this check with api.networkPolicy.cniConfirmed=true." -}}
{{- end -}}
{{- if and .Values.web.networkPolicy.enabled (not .Values.web.networkPolicy.cniConfirmed) -}}
  {{- fail "NetworkPolicy requires a CNI that enforces it (Calico, Cilium, Canal, Weave Net). Flannel silently ignores NetworkPolicy resources. Set networkPolicy.enabled=false if your CNI does not support it, or suppress this check with web.networkPolicy.cniConfirmed=true." -}}
{{- end -}}
{{- /*
  Ingress hostname guard.
  When ingress is enabled, at least one of ingress.hostname, ingress.api.hostname,
  or ingress.web.hostname must be set. An enabled Ingress with no hostname renders
  resources with an empty host rule, which silently matches all requests and
  causes unexpected routing in multi-tenant clusters.
*/ -}}
{{- if .Values.ingress.enabled -}}
  {{- $hasShared := .Values.ingress.hostname -}}
  {{- $hasApi := .Values.ingress.api.hostname -}}
  {{- $hasWeb := .Values.ingress.web.hostname -}}
  {{- if not (or $hasShared $hasApi $hasWeb) -}}
    {{- fail "CONFIGURATION: ingress.enabled is true but no hostname is configured. Set ingress.hostname (shared) or ingress.api.hostname / ingress.web.hostname for subdomain routing." -}}
  {{- end -}}
{{- end -}}
