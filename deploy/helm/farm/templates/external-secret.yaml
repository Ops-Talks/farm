{{- if .Values.api.externalSecret.enabled }}
# ── External Secrets Operator integration ─────────────────────────────────────
# Renders an ExternalSecret (external-secrets.io/v1beta1) that syncs secrets
# from a configured secret store into a Kubernetes Secret consumed by the API
# pod and migration Job.
#
# Prerequisites:
#   1. Install the External Secrets Operator:
#        helm install eso external-secrets/external-secrets -n external-secrets --create-namespace
#   2. Create a SecretStore or ClusterSecretStore resource pointing to your
#      secret backend (AWS Secrets Manager, HashiCorp Vault, GCP Secret Manager, etc.)
#   3. Set api.externalSecret.secretStoreRef.name and .remoteRef.key
#
# When this is enabled, set api.existingSecret to the name rendered by the
# ExternalSecret target ({{ include "farm.fullname" . }}-api) so the Deployment
# and migration Job reference the synced Secret.
#
# API version selection: prefer external-secrets.io/v1 when the cluster
# advertises it (ESO >= 0.10), and fall back to v1beta1 for older operator
# installs that have not yet been upgraded. The two schemas are compatible
# for the fields used below (secretStoreRef, target, data[].remoteRef).
{{- if .Capabilities.APIVersions.Has "external-secrets.io/v1" }}
apiVersion: external-secrets.io/v1
{{- else }}
apiVersion: external-secrets.io/v1beta1
{{- end }}
kind: ExternalSecret
metadata:
  name: {{ include "farm.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.api.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.api.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.api.externalSecret.secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ include "farm.fullname" . }}-api
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.api.externalSecret.remoteRef.key }}
        property: JWT_SECRET
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: {{ .Values.api.externalSecret.remoteRef.key }}
        property: DATABASE_PASSWORD
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.api.externalSecret.remoteRef.key }}
        property: REDIS_PASSWORD
{{- end }}
