{{- if .Values.api.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "farm.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "farm.api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "farm.web.selectorLabels" . | nindent 14 }}
        {{- if .Values.api.networkPolicy.ingressControllerNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml .Values.api.networkPolicy.ingressControllerNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.api.networkPolicy.ingressControllerPodSelector | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution (required for all external lookups)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Outbound HTTPS — external integrations (GitHub, ArgoCD, Kubernetes API, etc.)
    - ports:
        - protocol: TCP
          port: 443
    # Outbound HTTP
    - ports:
        - protocol: TCP
          port: 80
    # Database access — scoped by `to:` so the rule does not implicitly allow
    # the DB port to any destination. If no selector is configured the rule is
    # omitted entirely (DB egress is denied) and the operator must set
    # api.networkPolicy.externalDatabaseEgress or externalDatabase.egressIpBlock
    # when using an external DB.
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ include "farm.databasePort" . | int }}
    {{- else if .Values.externalDatabase.egressIpBlock }}
    - to:
        - ipBlock:
            cidr: {{ .Values.externalDatabase.egressIpBlock }}
      ports:
        - protocol: TCP
          port: {{ include "farm.databasePort" . | int }}
    {{- else if .Values.api.networkPolicy.externalDatabaseEgress }}
    - to:
        {{- toYaml .Values.api.networkPolicy.externalDatabaseEgress | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "farm.databasePort" . | int }}
    {{- end }}
    # Redis access — same `to:` scoping rule as the database egress above.
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ include "farm.redisPort" . | int }}
    {{- else if .Values.externalRedis.egressIpBlock }}
    - to:
        - ipBlock:
            cidr: {{ .Values.externalRedis.egressIpBlock }}
      ports:
        - protocol: TCP
          port: {{ include "farm.redisPort" . | int }}
    {{- else if .Values.api.networkPolicy.externalRedisEgress }}
    - to:
        {{- toYaml .Values.api.networkPolicy.externalRedisEgress | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "farm.redisPort" . | int }}
    {{- end }}
    {{- with .Values.api.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
