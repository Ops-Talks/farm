apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "farm.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.api.labels" . | nindent 4 }}
data:
  # Non-sensitive application environment.
  # All keys defined under api.env are included automatically — add custom
  # keys there and they will be picked up without modifying this template.
  {{- range $key := (.Values.api.env | keys | sortAlpha) }}
  {{- $value := get $.Values.api.env $key }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

  # Database connection details (computed from postgresql/externalDatabase config).
  DATABASE_TYPE: postgres
  DATABASE_HOST: {{ include "farm.databaseHost" . | quote }}
  DATABASE_PORT: {{ include "farm.databasePort" . | quote }}
  DATABASE_USER: {{ include "farm.databaseUser" . | quote }}
  DATABASE_NAME: {{ include "farm.databaseName" . | quote }}

  # Redis connection details (computed from redis/externalRedis config).
  REDIS_HOST: {{ include "farm.redisHost" . | quote }}
  REDIS_PORT: {{ include "farm.redisPort" . | quote }}

  # Observability — OpenTelemetry
  {{- if .Values.tracing.enabled }}
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: {{ .Values.tracing.serviceName | quote }}
  {{- if .Values.tracing.endpoint }}
  OTEL_EXPORTER_ENDPOINT: {{ .Values.tracing.endpoint | quote }}
  {{- end }}
  {{- end }}

  # Observability — Pyroscope
  {{- if .Values.pyroscope.enabled }}
  PYROSCOPE_ENABLED: "true"
  {{- if .Values.pyroscope.url }}
  PYROSCOPE_URL: {{ .Values.pyroscope.url | quote }}
  {{- end }}
  {{- end }}

  # Observability — Backend URLs (used by the API to proxy queries)
  {{- if .Values.api.observability.grafanaUrl }}
  GRAFANA_URL: {{ .Values.api.observability.grafanaUrl | quote }}
  {{- end }}
  {{- if .Values.api.observability.prometheusUrl }}
  PROMETHEUS_URL: {{ .Values.api.observability.prometheusUrl | quote }}
  {{- end }}
  {{- if .Values.api.observability.tempoUrl }}
  TEMPO_URL: {{ .Values.api.observability.tempoUrl | quote }}
  {{- end }}
  {{- if .Values.api.observability.lokiUrl }}
  LOKI_URL: {{ .Values.api.observability.lokiUrl | quote }}
  {{- end }}
