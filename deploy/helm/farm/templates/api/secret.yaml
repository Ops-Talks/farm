{{- if not .Values.api.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "farm.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.api.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.api.secrets.JWT_SECRET | quote }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- else if .Values.externalDatabase.existingSecret }}
  {{- /* Password sourced from existingSecret — not embedded here */}}
  {{- else }}
  DATABASE_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  {{- if .Values.redis.auth.enabled }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | default "" | quote }}
  {{- end }}
  {{- else if .Values.externalRedis.existingSecret }}
  {{- /* Redis password sourced from existingSecret — not embedded here */}}
  {{- else if .Values.externalRedis.password }}
  REDIS_PASSWORD: {{ .Values.externalRedis.password | quote }}
  {{- end }}
  SMTP_PASS: {{ .Values.api.secrets.SMTP_PASS | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.api.secrets.GITHUB_CLIENT_SECRET | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.api.secrets.GOOGLE_CLIENT_SECRET | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.api.secrets.KEYCLOAK_CLIENT_SECRET | quote }}
  LDAP_BIND_PASSWORD: {{ .Values.api.secrets.LDAP_BIND_PASSWORD | quote }}
  IAC_INGEST_TOKEN: {{ .Values.api.secrets.IAC_INGEST_TOKEN | quote }}
  SWAGGER_PASSWORD: {{ .Values.api.secrets.SWAGGER_PASSWORD | quote }}
{{- end }}
