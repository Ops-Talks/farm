apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "farm.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "farm.api.selectorLabels" . | nindent 6 }}
  strategy:
    {{- toYaml .Values.api.updateStrategy | nindent 4 }}
  minReadySeconds: {{ .Values.api.minReadySeconds }}
  template:
    metadata:
      labels:
        {{- include "farm.api.selectorLabels" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Force pod restart when ConfigMap or Secret content changes.
        checksum/config: {{ include (print $.Template.BasePath "/api/configmap.yaml") . | sha256sum }}
        {{- if .Values.api.existingSecret }}
        # FARM-S609: when an externally managed Secret is referenced, hash its
        # resourceVersion so that rotations (ESO re-sync, SealedSecret redecrypt,
        # manual kubectl update) roll the Deployment automatically.
        # The lookup returns "" in helm template --dry-run mode; the sha256sum of
        # an empty string is stable and does not cause spurious rollouts.
        # Alternate: annotate the Deployment with reloader.stakater.com/auto: "true"
        # and install Reloader — see README "Secret Rotation" for details.
        checksum/secret: {{ (lookup "v1" "Secret" .Release.Namespace .Values.api.existingSecret).metadata.resourceVersion | default "" | sha256sum }}
        {{- else }}
        checksum/secret: {{ include (print $.Template.BasePath "/api/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "farm.api.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "farm.api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- if .Values.migration.waitForJob }}
      # FARM-S604: optional strict sequencing — block API startup until the
      # migration Job completes. Requires ClusterRole "get/list/watch" on
      # batch/jobs for the API ServiceAccount. Disabled by default because
      # TypeORM's advisory lock makes parallel execution idempotent.
      initContainers:
        - name: wait-for-migration
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
            - wait
            - --for=condition=complete
            - job/{{ include "farm.fullname" . }}-migration
            - --timeout=300s
            - --namespace={{ .Release.Namespace }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      {{- end }}
      containers:
        - name: api
          image: {{ include "farm.api.image" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          lifecycle:
            {{- toYaml .Values.api.lifecycle | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "farm.fullname" . }}-api
            - secretRef:
                name: {{ .Values.api.existingSecret | default (printf "%s-api" (include "farm.fullname" .)) }}
          {{- $externalSecretEnv := include "farm.api.externalSecretEnv" . | trim }}
          {{- if or .Values.api.extraEnv $externalSecretEnv }}
          env:
            {{- if $externalSecretEnv }}
            {{- $externalSecretEnv | nindent 12 }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          {{- with .Values.api.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- with .Values.api.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
