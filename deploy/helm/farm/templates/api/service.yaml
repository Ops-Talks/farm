apiVersion: v1
kind: Service
metadata:
  name: {{ include "farm.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "farm.api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "farm.api.selectorLabels" . | nindent 4 }}
