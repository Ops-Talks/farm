            sloth_objective: "99.5"
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-latency
            sloth_spec: prometheus/v1
            sloth_version: v0.16.0
            team: farm

    - name: sloth-slo-alerts-{{ $apiJob }}-requests-latency
      rules:
        - alert: FarmApiLatencySLO
          expr: |
            (
                max(slo:sli_error:ratio_rate5m{sloth_id="{{ $apiJob }}-requests-latency", sloth_service="{{ $apiJob }}", sloth_slo="requests-latency"} > (14.4 * 0.005)) without (sloth_window)
                and
