            )
            or
            (
                max(slo:sli_error:ratio_rate30m{sloth_id="{{ $apiJob }}-requests-latency", sloth_service="{{ $apiJob }}", sloth_slo="requests-latency"} > (6 * 0.005)) without (sloth_window)
                and
