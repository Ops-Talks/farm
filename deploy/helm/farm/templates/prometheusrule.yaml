                and
                max(slo:sli_error:ratio_rate3d{sloth_id="{{ $apiJob }}-requests-latency", sloth_service="{{ $apiJob }}", sloth_slo="requests-latency"} > (1 * 0.005)) without (sloth_window)
            )
          labels:
            category: latency
            severity: warning
            sloth_severity: ticket
          annotations:
            summary: "Farm API latency SLO burn rate"
