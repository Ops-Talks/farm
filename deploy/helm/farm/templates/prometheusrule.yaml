        - record: slo:current_burn_rate:ratio
          expr: |
            slo:sli_error:ratio_rate5m{sloth_id="{{ $apiJob }}-requests-latency", sloth_service="{{ $apiJob }}", sloth_slo="requests-latency"}
            / on(sloth_id, sloth_slo, sloth_service) group_left
