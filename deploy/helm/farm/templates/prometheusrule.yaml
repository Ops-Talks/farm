{{- if .Values.prometheusRule.enabled }}
{{- $apiJob := printf "%s-api" (include "farm.fullname" .) -}}
{{- $webJob := printf "%s-web" (include "farm.fullname" .) -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "farm.fullname" . }}
  namespace: {{ .Values.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "farm.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: farm_api_alerts
      interval: 30s
      rules:
        - alert: FarmApiHighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{status_code=~"5..",job="{{ $apiJob }}"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
            service: farm-api
          annotations:
            summary: "Farm API high error rate"
            description: "API 5xx error rate is {{ `{{ $value | humanizePercentage }}` }} (threshold: 5%)"
            runbook_url: {{ printf "%s#farmapihigherrorrate" .Values.prometheusRule.runbookBaseUrl | quote }}

        - alert: FarmApiHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{job="{{ $apiJob }}"}[5m])) by (le)
            ) > 2
          for: 5m
          labels:
            severity: warning
            service: farm-api
          annotations:
            summary: "Farm API high P99 latency"
            description: "P99 latency is {{ `{{ $value | humanizeDuration }}` }} (threshold: 2s)"
            runbook_url: {{ printf "%s#farmapihighlatency" .Values.prometheusRule.runbookBaseUrl | quote }}

        - alert: FarmApiNodeHeapHigh
          expr: |
            nodejs_heap_size_used_bytes{job="{{ $apiJob }}"}
            /
            nodejs_heap_size_total_bytes{job="{{ $apiJob }}"} > 0.80
          for: 5m
          labels:
            severity: warning
            service: farm-api
          annotations:
            summary: "Farm API Node.js heap usage high"
            description: "Heap usage is {{ `{{ $value | humanizePercentage }}` }} (threshold: 80%)"
            runbook_url: {{ printf "%s#farmapinodesheaphigh" .Values.prometheusRule.runbookBaseUrl | quote }}

        - alert: FarmApiDown
          expr: up{job="{{ $apiJob }}"} == 0
          for: 1m
          labels:
            severity: critical
            service: farm-api
          annotations:
            summary: "Farm API is down"
            description: "The Farm API has been unreachable for more than 1 minute"
            runbook_url: {{ printf "%s#farmapidown" .Values.prometheusRule.runbookBaseUrl | quote }}

    - name: farm_api_recording
      interval: 30s
      rules:
        - record: job:http_requests_total:rate5m
          expr: sum by (job, status_code) (rate(http_request_duration_seconds_count[5m]))

        - record: job:http_request_duration_seconds:p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))
            )

        - record: job:http_request_duration_seconds:p95_5m
          expr: |
            histogram_quantile(0.95,
              sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))
            )

        - record: job:http_error_rate:ratio_rate5m
          expr: |
            sum by (job) (rate(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
            /
            sum by (job) (rate(http_request_duration_seconds_count[5m]))

    - name: sloth-slo-sli-recordings-{{ $apiJob }}-requests-availability
      rules:
        - record: slo:sli_error:ratio_rate5m
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}",status_code=~"5.."}[5m])))
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[5m])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            sloth_window: 5m
            team: farm
        - record: slo:sli_error:ratio_rate30m
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}",status_code=~"5.."}[30m])))
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[30m])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            sloth_window: 30m
            team: farm
        - record: slo:sli_error:ratio_rate1h
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}",status_code=~"5.."}[1h])))
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[1h])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            sloth_window: 1h
            team: farm
        - record: slo:sli_error:ratio_rate2h
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}",status_code=~"5.."}[2h])))
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[2h])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            sloth_window: 2h
            team: farm
        - record: slo:sli_error:ratio_rate6h
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}",status_code=~"5.."}[6h])))
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[6h])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            sloth_window: 6h
            team: farm
        - record: slo:sli_error:ratio_rate1d
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}",status_code=~"5.."}[1d])))
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[1d])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            sloth_window: 1d
            team: farm
        - record: slo:sli_error:ratio_rate3d
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}",status_code=~"5.."}[3d])))
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[3d])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            sloth_window: 3d
            team: farm
        - record: slo:sli_error:ratio_rate30d
          expr: |
            sum_over_time(slo:sli_error:ratio_rate5m{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"}[30d])
            / ignoring (sloth_window)
            count_over_time(slo:sli_error:ratio_rate5m{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"}[30d])
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            sloth_window: 30d
            team: farm

    - name: sloth-slo-meta-recordings-{{ $apiJob }}-requests-availability
      rules:
        - record: slo:objective:ratio
          expr: vector(0.995)
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            team: farm
        - record: slo:error_budget:ratio
          expr: vector(1-0.995)
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            team: farm
        - record: slo:time_period:days
          expr: vector(30)
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            team: farm
        - record: slo:current_burn_rate:ratio
          expr: |
            slo:sli_error:ratio_rate5m{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"}
            / on(sloth_id, sloth_slo, sloth_service) group_left
            slo:error_budget:ratio{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"}
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            team: farm
        - record: slo:period_burn_rate:ratio
          expr: |
            slo:sli_error:ratio_rate30d{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"}
            / on(sloth_id, sloth_slo, sloth_service) group_left
            slo:error_budget:ratio{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"}
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            team: farm
        - record: slo:period_error_budget_remaining:ratio
          expr: 1 - slo:period_burn_rate:ratio{sloth_id="{{ $apiJob }}-requests-availability",
            sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"}
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            team: farm
        - record: sloth_slo_info
          expr: vector(1)
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-availability
            sloth_mode: cli-gen-prom
            sloth_objective: "99.5"
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-availability
            sloth_spec: prometheus/v1
            sloth_version: v0.16.0
            team: farm

    - name: sloth-slo-alerts-{{ $apiJob }}-requests-availability
      rules:
        - alert: FarmApiAvailabilitySLO
          expr: |
            (
                max(slo:sli_error:ratio_rate5m{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"} > (14.4 * 0.005)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate1h{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"} > (14.4 * 0.005)) without (sloth_window)
            )
            or
            (
                max(slo:sli_error:ratio_rate30m{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"} > (6 * 0.005)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate6h{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"} > (6 * 0.005)) without (sloth_window)
            )
          labels:
            category: availability
            severity: critical
            sloth_severity: page
          annotations:
            summary: "Farm API availability SLO burn rate"
            title: "(page) {{`{{$labels.sloth_service}}`}} {{`{{$labels.sloth_slo}}`}} SLO error budget burn rate is too fast."
        - alert: FarmApiAvailabilitySLO
          expr: |
            (
                max(slo:sli_error:ratio_rate2h{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"} > (3 * 0.005)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate1d{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"} > (3 * 0.005)) without (sloth_window)
            )
            or
            (
                max(slo:sli_error:ratio_rate6h{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"} > (1 * 0.005)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate3d{sloth_id="{{ $apiJob }}-requests-availability", sloth_service="{{ $apiJob }}", sloth_slo="requests-availability"} > (1 * 0.005)) without (sloth_window)
            )
          labels:
            category: availability
            severity: warning
            sloth_severity: ticket
          annotations:
            summary: "Farm API availability SLO burn rate"
            title: "(ticket) {{`{{$labels.sloth_service}}`}} {{`{{$labels.sloth_slo}}`}} SLO error budget burn rate is too fast."

    - name: sloth-slo-sli-recordings-{{ $apiJob }}-requests-latency
      rules:
        - record: slo:sli_error:ratio_rate5m
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[5m]))
            - sum(rate(http_request_duration_seconds_bucket{job="{{ $apiJob }}",le="0.5"}[5m]))
            )
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[5m])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-latency
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-latency
            sloth_window: 5m
            team: farm
        - record: slo:sli_error:ratio_rate30m
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[30m]))
            - sum(rate(http_request_duration_seconds_bucket{job="{{ $apiJob }}",le="0.5"}[30m]))
            )
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[30m])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-latency
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-latency
            sloth_window: 30m
            team: farm
        - record: slo:sli_error:ratio_rate1h
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[1h]))
            - sum(rate(http_request_duration_seconds_bucket{job="{{ $apiJob }}",le="0.5"}[1h]))
            )
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[1h])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-latency
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-latency
            sloth_window: 1h
            team: farm
        - record: slo:sli_error:ratio_rate2h
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[2h]))
            - sum(rate(http_request_duration_seconds_bucket{job="{{ $apiJob }}",le="0.5"}[2h]))
            )
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[2h])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-latency
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-latency
            sloth_window: 2h
            team: farm
        - record: slo:sli_error:ratio_rate6h
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[6h]))
            - sum(rate(http_request_duration_seconds_bucket{job="{{ $apiJob }}",le="0.5"}[6h]))
            )
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[6h])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-latency
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-latency
            sloth_window: 6h
            team: farm
        - record: slo:sli_error:ratio_rate1d
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[1d]))
            - sum(rate(http_request_duration_seconds_bucket{job="{{ $apiJob }}",le="0.5"}[1d]))
            )
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[1d])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-latency
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-latency
            sloth_window: 1d
            team: farm
        - record: slo:sli_error:ratio_rate3d
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[3d]))
            - sum(rate(http_request_duration_seconds_bucket{job="{{ $apiJob }}",le="0.5"}[3d]))
            )
            /
            (sum(rate(http_request_duration_seconds_count{job="{{ $apiJob }}"}[3d])))
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-latency
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-latency
            sloth_window: 3d
            team: farm
        - record: slo:sli_error:ratio_rate30d
          expr: |
            sum_over_time(slo:sli_error:ratio_rate5m{sloth_id="{{ $apiJob }}-requests-latency", sloth_service="{{ $apiJob }}", sloth_slo="requests-latency"}[30d])
            / ignoring (sloth_window)
            count_over_time(slo:sli_error:ratio_rate5m{sloth_id="{{ $apiJob }}-requests-latency", sloth_service="{{ $apiJob }}", sloth_slo="requests-latency"}[30d])
          labels:
            env: production
            sloth_id: {{ $apiJob }}-requests-latency
            sloth_service: {{ $apiJob }}
            sloth_slo: requests-latency
