{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "farm.fullname" . }}
  namespace: {{ .Values.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "farm.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: farm_api_alerts
      interval: 30s
      rules:
        - alert: FarmApiHighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{status_code=~"5..",job="farm-api"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="farm-api"}[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
            service: farm-api
          annotations:
            summary: "Farm API high error rate"
            description: "API 5xx error rate is {{ `{{ $value | humanizePercentage }}` }} (threshold: 5%)"
            runbook_url: {{ printf "%s#farmapihigherrorrate" .Values.prometheusRule.runbookBaseUrl | quote }}

        - alert: FarmApiHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{job="farm-api"}[5m])) by (le)
            ) > 2
          for: 5m
          labels:
            severity: warning
            service: farm-api
          annotations:
            summary: "Farm API high P99 latency"
            description: "P99 latency is {{ `{{ $value | humanizeDuration }}` }} (threshold: 2s)"
            runbook_url: {{ printf "%s#farmapihighlatency" .Values.prometheusRule.runbookBaseUrl | quote }}

        - alert: FarmApiNodeHeapHigh
          # FARM-S608: switched from nodejs_heap_size_used_bytes/nodejs_heap_size_total_bytes
          # (which measures only the V8 heap) to container_memory_working_set_bytes /
          # container_spec_memory_limit_bytes (which measures actual container memory
          # pressure against the cgroup limit, the same signal the OOM killer uses).
          # This is a more actionable SLI: if working_set/limit > 0.8 the container is
          # close to its OOM kill threshold.
          expr: |
            container_memory_working_set_bytes{container="api", job="kubelet"}
            /
            container_spec_memory_limit_bytes{container="api", job="kubelet"} > 0.80
          for: 5m
          labels:
            severity: warning
            service: farm-api
          annotations:
            summary: "Farm API container memory pressure high"
            description: "Container working set memory is {{ `{{ $value | humanizePercentage }}` }} of the cgroup limit (threshold: 80%)"
            runbook_url: {{ printf "%s#farmapinodesheaphigh" .Values.prometheusRule.runbookBaseUrl | quote }}

        - alert: FarmApiDown
          expr: up{job="farm-api"} == 0
          for: 1m
          labels:
            severity: critical
            service: farm-api
          annotations:
            summary: "Farm API is down"
            description: "The Farm API has been unreachable for more than 1 minute"
            runbook_url: {{ printf "%s#farmapidown" .Values.prometheusRule.runbookBaseUrl | quote }}

    - name: farm_api_recording
      interval: 30s
      rules:
        - record: job:http_requests_total:rate5m
          expr: sum by (job, status_code) (rate(http_request_duration_seconds_count[5m]))

        - record: job:http_request_duration_seconds:p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))
            )

        - record: job:http_request_duration_seconds:p95_5m
          expr: |
            histogram_quantile(0.95,
              sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))
            )

        - record: job:http_error_rate:ratio_rate5m
          expr: |
            sum by (job) (rate(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
            /
            sum by (job) (rate(http_request_duration_seconds_count[5m]))
{{- end }}
