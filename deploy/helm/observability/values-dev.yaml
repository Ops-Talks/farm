# ─── Farm Observability Chart — values-dev.yaml ──────────────────────────────
# Lightweight overrides for local Kubernetes (KinD) development.
# No persistence, minimal resources, disabled heavy scrape targets.

# ─── KUBE-PROMETHEUS-STACK ───────────────────────────────────────────────────
kube-prometheus-stack:
  grafana:
    # FARM-S579: In dev, skip the existingSecret requirement by providing
    # inline credentials. Never replicate this pattern in production.
    admin:
      existingSecret: ""
    adminUser: admin
    adminPassword: admin

    # FARM-S580: Enable anonymous access in development only.
    # Production keeps auth.anonymous.enabled: false (see values.yaml).
    grafana.ini:
      auth.anonymous:
        enabled: true
        org_role: Viewer

    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

  prometheus:
    prometheusSpec:
      retention: 1d
      storageSpec: {}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi

  alertmanager:
    alertmanagerSpec:
      storage: {}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

  # These control-plane endpoints are not accessible in KinD.
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false

# ─── LOKI ────────────────────────────────────────────────────────────────────
loki:
  loki:
    # FARM-S581: Disable auth in development to avoid needing X-Scope-OrgID
    # headers on every push/query. Production keeps auth_enabled: true.
    auth_enabled: false

  singleBinary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

# ─── TEMPO ───────────────────────────────────────────────────────────────────
tempo:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# ─── ALLOY ───────────────────────────────────────────────────────────────────
alloy:
  alloy:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

# ─── PYROSCOPE ───────────────────────────────────────────────────────────────
pyroscope:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
