apiVersion: v2
name: farm-observability
description: |
  Observability platform for Farm clusters — kube-prometheus-stack, Loki, Tempo,
  Alloy, and Pyroscope deployed as independent services in the monitoring namespace.
  Install alongside the Farm chart: make observability-install
type: application
version: 0.27.2
appVersion: "0.27.2"
kubeVersion: ">=1.27.0-0"
home: https://github.com/Ops-Talks/farm
sources:
  - https://github.com/Ops-Talks/farm
keywords:
  - farm
  - observability
  - monitoring
  - prometheus
  - grafana
  - loki
  - tempo
  - pyroscope
maintainers:
  - name: Ops-Talks
    url: https://github.com/Ops-Talks

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Ops-Talks/farm
    - name: Support
      url: https://github.com/Ops-Talks/farm/issues
  artifacthub.io/images: |
    - name: kube-prometheus-stack
      image: quay.io/prometheus/prometheus:v3.12.0-distroless
    - name: grafana
      image: docker.io/grafana/grafana:13.0.1-security-01
    - name: loki
      image: docker.io/grafana/loki:3.6.7
    - name: tempo
      image: docker.io/grafana/tempo:2.9.0
    - name: alloy
      image: docker.io/grafana/alloy:v1.16.3
    - name: pyroscope
      image: docker.io/grafana/pyroscope:2.0.3
  artifacthub.io/changes: |
    - kind: changed
      description: "bump kube-prometheus-stack to 86.2.2 (prometheus v3.12.0-distroless, grafana 13.0.1-security-01)"
    - kind: changed
      description: "bump loki to 7.0.0 (loki 3.6.7)"
    - kind: changed
      description: "bump alloy to 1.9.0 (alloy v1.16.3)"
    - kind: changed
      description: "bump pyroscope to 2.0.3 (pyroscope 2.0.3)"

dependencies:
  # Prometheus + Grafana + Alertmanager + node-exporter + kube-state-metrics
  - name: kube-prometheus-stack
    version: "86.2.2"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled

  # Log aggregation
  - name: loki
    version: "7.0.0"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled

  # Distributed tracing
  - name: tempo
    version: "1.24.4"
    repository: https://grafana.github.io/helm-charts
    condition: tempo.enabled

  # Telemetry collector (replaces Promtail; handles logs, traces, Faro RUM)
  - name: alloy
    version: "1.9.0"
    repository: https://grafana.github.io/helm-charts
    condition: alloy.enabled

  # Continuous profiling
  - name: pyroscope
    version: "2.0.3"
    repository: https://grafana.github.io/helm-charts
    condition: pyroscope.enabled
