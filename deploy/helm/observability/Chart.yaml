apiVersion: v2
name: farm-observability
description: |
  Observability platform for Farm clusters — kube-prometheus-stack, Loki, Tempo,
  Alloy, and Pyroscope deployed as independent services in the monitoring namespace.
  Install alongside the Farm chart: make observability-install
type: application
version: 0.25.13
appVersion: "0.25.13"
kubeVersion: ">=1.27.0-0"
home: https://github.com/Ops-Talks/farm
sources:
  - https://github.com/Ops-Talks/farm
keywords:
  - farm
  - observability
  - monitoring
  - prometheus
  - grafana
  - loki
  - tempo
  - pyroscope
maintainers:
  - name: Ops-Talks
    url: https://github.com/Ops-Talks

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Ops-Talks/farm
    - name: Support
      url: https://github.com/Ops-Talks/farm/issues
  artifacthub.io/images: |
    - name: kube-prometheus-stack
      image: quay.io/prometheus/prometheus:v3.4.0
    - name: grafana
      image: grafana/grafana:12.0.0
    - name: loki
      image: grafana/loki:3.5.0
    - name: tempo
      image: grafana/tempo:2.7.2
    - name: alloy
      image: grafana/alloy:v1.8.2
    - name: pyroscope
      image: grafana/pyroscope:1.13.4
  artifacthub.io/changes: |
    - kind: changed
      description: "chart version field now mirrors appVersion — both are set to the application semver on every release, eliminating ArtifactHub publish skips caused by unchanged chart version"

dependencies:
  # Prometheus + Grafana + Alertmanager + node-exporter + kube-state-metrics
  - name: kube-prometheus-stack
    version: "72.3.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled

  # Log aggregation
  - name: loki
    version: "6.55.0"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled

  # Distributed tracing
  - name: tempo
    version: "1.24.4"
    repository: https://grafana.github.io/helm-charts
    condition: tempo.enabled

  # Telemetry collector (replaces Promtail; handles logs, traces, Faro RUM)
  - name: alloy
    version: "1.8.2"
    repository: https://grafana.github.io/helm-charts
    condition: alloy.enabled

  # Continuous profiling
  - name: pyroscope
    version: "1.21.0"
    repository: https://grafana.github.io/helm-charts
    condition: pyroscope.enabled
