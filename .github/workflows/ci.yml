name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          compile-types: 'false'

      - name: Run lint
        run: npm run lint -w apps/api

      - name: Run unit tests with coverage
        run: npm run test:cov -w apps/api
        env:
          JEST_JUNIT_CLASSNAME: "{filepath}"

      - name: Run E2E tests
        run: npm run test:e2e -w apps/api
        env:
          JEST_JUNIT_CLASSNAME: "{filepath}"

      - name: Build API
        run: npm run build -w apps/api

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.0
        if: ${{ !cancelled() }}
        with:
          files: ./apps/api/coverage/lcov.info
          flags: api
          name: api-coverage
          slug: Ops-Talks/farm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload unit test results to Codecov
        uses: codecov/codecov-action@v6.0.0
        if: ${{ !cancelled() }}
        with:
          files: ./apps/api/coverage/junit.xml
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Upload E2E test results to Codecov
        uses: codecov/codecov-action@v6.0.0
        if: ${{ !cancelled() }}
        with:
          files: ./apps/api/coverage/junit-e2e.xml
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  migrations:
    name: Migration integrity (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          compile-types: 'false'

      - name: Build API
        run: npm run build -w apps/api

      - name: Generate ephemeral JWT secret
        id: secrets
        run: echo "jwt=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT

      - name: Run migrations
        run: npm run migration:run -w apps/api
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: password
          DATABASE_NAME: farm
          DATABASE_SYNC: "false"
          JWT_SECRET: ${{ steps.secrets.outputs.jwt }}
          NODE_ENV: test
  # Roll-up job: single required check for branch protection rules.
  all-checks-passed:
    name: All checks passed (API CI)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [api, migrations]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed."
