name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/helm/farm/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/helm/farm/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          compile-types: 'false'

      - name: Run lint
        run: npm run lint -w apps/api

      - name: Run unit tests with coverage
        run: npm run test:cov -w apps/api
        env:
          JEST_JUNIT_CLASSNAME: "{filepath}"

      - name: Run E2E tests
        run: npm run test:e2e -w apps/api
        env:
          JEST_JUNIT_CLASSNAME: "{filepath}"

      - name: Build API
        run: npm run build -w apps/api

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.1
        if: ${{ !cancelled() }}
        with:
          files: ./apps/api/coverage/lcov.info
          flags: api
          name: api-coverage
          slug: Ops-Talks/farm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload unit test results to Codecov
        uses: codecov/codecov-action@v6.0.1
        if: ${{ !cancelled() }}
        with:
          files: ./apps/api/coverage/junit.xml
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          fail_ci_if_error: false

      - name: Upload E2E test results to Codecov
        uses: codecov/codecov-action@v6.0.1
        if: ${{ !cancelled() }}
        with:
          files: ./apps/api/coverage/junit-e2e.xml
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          fail_ci_if_error: false

  openapi-snapshot:
    name: OpenAPI snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [api]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          compile-types: 'false'

      - name: Build API
        run: npm run build -w apps/api

      - name: Generate ephemeral JWT secret
        id: secrets
        run: echo "jwt=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT

      - name: Run migrations
        run: npm run migration:run -w apps/api
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: password
          DATABASE_NAME: farm
          DATABASE_SYNC: "false"
          JWT_SECRET: ${{ steps.secrets.outputs.jwt }}
          NODE_ENV: test

      - name: Start API server
        run: node apps/api/dist/main.js &
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: password
          DATABASE_NAME: farm
          DATABASE_SYNC: "false"
          JWT_SECRET: ${{ steps.secrets.outputs.jwt }}
          NODE_ENV: test
          PORT: 3000
          SWAGGER_USER: farm-ci-snapshot
          SWAGGER_PASSWORD: farm-ci-snapshot

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "API is ready after ${i}s"
              exit 0
            fi
            echo "Waiting for API... (attempt ${i}/30)"
            sleep 1
          done
          echo "::error::API did not become ready within 30 seconds"
          exit 1

      - name: Download OpenAPI spec
        run: |
          curl -sf \
            -u farm-ci-snapshot:farm-ci-snapshot \
            http://localhost:3000/api/docs-json \
            -o openapi-snapshot.json
          echo "OpenAPI spec downloaded ($(wc -c < openapi-snapshot.json) bytes)"

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi-snapshot.json
          retention-days: 30

  migrations:
    name: Migration integrity (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          compile-types: 'false'

      - name: Build API
        run: npm run build -w apps/api

      - name: Generate ephemeral JWT secret
        id: secrets
        run: echo "jwt=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT

      - name: Run migrations
        run: npm run migration:run -w apps/api
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: password
          DATABASE_NAME: farm
          DATABASE_SYNC: "false"
          JWT_SECRET: ${{ steps.secrets.outputs.jwt }}
          NODE_ENV: test

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.4

      - name: Lint chart (strict)
        # Subchart .tgz archives are committed to git (Chart.lock pinned to
        # postgresql-15.5.38 / redis-19.6.4) so no `helm dependency update`
        # call is needed — the charts/ directory is already populated.
        run: |
          helm lint deploy/helm/farm \
            --strict \
            --set api.image.repository=test \
            --set web.image.repository=test

      - name: Render templates (dev values)
        run: |
          helm template farm deploy/helm/farm \
            -f deploy/helm/farm/values-dev.yaml \
            --set api.image.repository=test \
            --set web.image.repository=test \
            > /dev/null

  # Roll-up job: single required check for branch protection rules.
  all-checks-passed:
    name: All checks passed (API CI)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [api, migrations, openapi-snapshot, helm]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed."
