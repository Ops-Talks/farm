name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint -w apps/api

      - name: Run unit tests with coverage
        run: npm run test:cov -w apps/api
        env:
          JEST_JUNIT_CLASSNAME: "{filepath}"

      - name: Run E2E tests
        run: npm run test:e2e -w apps/api
        env:
          JEST_JUNIT_CLASSNAME: "{filepath}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          files: ./apps/api/coverage/lcov.info
          flags: api
          name: api-coverage
          slug: Ops-Talks/farm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload unit test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          files: ./apps/api/coverage/junit.xml
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload E2E test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          files: ./apps/api/coverage/junit-e2e.xml
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint -w apps/web

      - name: Run unit tests with coverage
        run: npm run test:coverage -w apps/web

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          files: ./apps/web/coverage/lcov.info
          flags: web
          name: web-coverage
          slug: Ops-Talks/farm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload unit test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          files: ./apps/web/coverage/junit.xml
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}