name: Container Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Re-scan weekly on Wednesday at 03:00 UTC to catch newly disclosed CVEs
    - cron: '0 3 * * 3'
  workflow_dispatch:

jobs:
  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to upload SARIF results to the GitHub Security tab
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: farm-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: farm-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Fail the build only on CRITICAL findings; HIGH findings are reported
          # but treated as warnings to avoid blocking PRs for transitive issues.
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Upload Trivy scan artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 30
