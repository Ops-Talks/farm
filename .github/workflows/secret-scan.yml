name: Secret Scanning

on:
  # Scan every push to every branch — secrets on feature branches are just
  # as dangerous as secrets on main before a PR is opened.
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fetch full history so gitleaks can scan all commit diffs in the push
          fetch-depth: 0
          persist-credentials: false

      # We invoke the gitleaks binary directly instead of using
      # gitleaks/gitleaks-action. The action wrapper now requires a paid
      # GITLEAKS_LICENSE for any repository owned by a GitHub organization
      # (community mode is no longer available for orgs), while the gitleaks
      # binary itself remains MIT-licensed and free. Pinning the version keeps
      # scans reproducible across runs.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          GITLEAKS_BIN_DIR="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${GITLEAKS_BIN_DIR}"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TMP_DIR}"' EXIT

          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS_FILE="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          RELEASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          cd "${TMP_DIR}"
          curl -fsSLO "${RELEASE_URL}/${TARBALL}"
          curl -fsSLO "${RELEASE_URL}/${CHECKSUMS_FILE}"

          grep "  ${TARBALL}\$" "${CHECKSUMS_FILE}" > "${TARBALL}.sha256"
          sha256sum -c "${TARBALL}.sha256"

          tar -xzf "${TARBALL}" -C "${GITLEAKS_BIN_DIR}" gitleaks
          chmod +x "${GITLEAKS_BIN_DIR}/gitleaks"
          echo "${GITLEAKS_BIN_DIR}" >> "${GITHUB_PATH}"
          "${GITLEAKS_BIN_DIR}/gitleaks" version

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Upload Gitleaks SARIF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30
