name: Secret Scanning

on:
  # Scan every push to every branch — secrets on feature branches are just
  # as dangerous as secrets on main before a PR is opened.
  push:
  pull_request:
    branches: [main, master]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Fetch full history so gitleaks can scan all commit diffs in the push
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for the org-level action feature;
          # not needed for public repos or personal use.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
