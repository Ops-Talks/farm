name: Secret Scanning

on:
  # Scan every push to every branch — secrets on feature branches are just
  # as dangerous as secrets on main before a PR is opened.
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Fetch full history so gitleaks can scan all commit diffs in the push
          fetch-depth: 0
          persist-credentials: false

      # We invoke the gitleaks binary directly instead of using
      # gitleaks/gitleaks-action. The action wrapper now requires a paid
      # GITLEAKS_LICENSE for any repository owned by a GitHub organization
      # (community mode is no longer available for orgs), while the gitleaks
      # binary itself remains MIT-licensed and free. Pinning the version keeps
      # scans reproducible across runs.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Upload Gitleaks SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30
