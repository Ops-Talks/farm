name: Secret Scanning

on:
  # Scan every push to every branch — secrets on feature branches are just
  # as dangerous as secrets on main before a PR is opened.
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Fetch full history so gitleaks can scan all commit diffs in the push
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required only for the commercial org-level scanning
          # feature. Public repos and personal use do not need this secret; if it
          # is unset the action runs in community mode without failing.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
