name: DAST

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dast.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dast.yml'
  schedule:
    # Run weekly on Tuesday at 03:00 UTC (day after SAST)
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── ZAP Baseline scan (passive — runs on push and PRs) ───────────────────
  zap-baseline:
    name: ZAP Baseline Scan (API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          compile-types: 'false'

      # Generate an ephemeral JWT secret so no static credential is stored in YAML.
      - name: Generate ephemeral JWT secret
        id: secrets
        run: echo "jwt=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT

      - name: Start API server
        uses: ./.github/actions/start-api-server
        with:
          jwt-secret: ${{ steps.secrets.outputs.jwt }}

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: 'http://localhost:3000/api'
          # Fail on high risk findings; warn on medium
          fail_action: true
          allow_issue_writing: false
          rules_file_name: '.github/zap/baseline-rules.tsv'
          cmd_options: '-I'

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-baseline-report
          path: report_html.html
          retention-days: 30

  # ── ZAP API scan (active — uses OpenAPI spec) ─────────────────────────────
  zap-api-scan:
    name: ZAP API Scan (OpenAPI spec)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on schedule or manual dispatch — active scan can be noisy on PRs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          compile-types: 'false'

      # Generate an ephemeral JWT secret so no static credential is stored in YAML.
      - name: Generate ephemeral JWT secret
        id: secrets
        run: echo "jwt=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT

      - name: Start API server
        uses: ./.github/actions/start-api-server
        with:
          jwt-secret: ${{ steps.secrets.outputs.jwt }}
          swagger-user: farm
          swagger-password: farm

      - name: Fetch OpenAPI spec
        env:
          SWAGGER_USER: farm
          SWAGGER_PASSWORD: farm
        run: |
          curl -sf -u "$SWAGGER_USER:$SWAGGER_PASSWORD" \
            http://localhost:3000/api/docs-json -o openapi.json
          echo "OpenAPI spec fetched"

      - name: Register test user and get JWT token
        id: auth
        run: |
          set -euo pipefail
          # Register the ZAP test user. HTTP 409 (conflict) means the user
          # already exists from a previous run — that is the only tolerated
          # non-2xx response. Any other error (4xx/5xx) fails the step.
          REGISTER_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"zap-user","password":"Zap@12345!","email":"zap@farm.dev","displayName":"ZAP"}')
          if [[ "$REGISTER_STATUS" != "2"* && "$REGISTER_STATUS" != "409" ]]; then
            echo "ERROR: Registration failed with HTTP $REGISTER_STATUS"
            exit 1
          fi
          TOKEN=$(curl -sf -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"zap-user","password":"Zap@12345!"}' | jq -r '.accessToken')
          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
            echo "ERROR: Failed to obtain JWT token — login response did not include accessToken"
            exit 1
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Write ZAP auth config
        # Avoid ${{ }} expression interpolation inside cmd_options by writing the
        # Bearer token through an env var into a ZAP properties file.
        env:
          AUTH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          mkdir -p .github/zap
          printf '%s\n' \
            'replacer.full_list(0).description=auth' \
            'replacer.full_list(0).enabled=true' \
            'replacer.full_list(0).matchtype=REQ_HEADER' \
            'replacer.full_list(0).matchstr=Authorization' \
            "replacer.full_list(0).replacement=Bearer ${AUTH_TOKEN}" \
            > .github/zap/api-auth.prop

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        with:
          target: 'openapi.json'
          format: openapi
          fail_action: true
          allow_issue_writing: false
          cmd_options: >-
            -config globalexcludeurl.url_list.url(0).regex='.*/auth/login.*'
            -config globalexcludeurl.url_list.url(1).regex='.*/auth/register.*'
            -z "-configfile /zap/wrk/.github/zap/api-auth.prop"

      - name: Upload ZAP API scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-api-scan-report
          path: report_html.html
          retention-days: 30

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: report_sarif.json
          category: zap-api-scan
