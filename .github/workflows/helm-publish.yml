name: Helm Chart Publish

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/helm/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel in-progress publishes — mid-run cancellation can corrupt OCI artifacts.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.chart.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        chart:
          - name: farm
            path: deploy/helm/farm
          - name: farm-observability
            path: deploy/helm/observability

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Helm
        # Download the tarball and verify SHA256 before extracting.
        # Fetching the checksum from get.helm.sh over TLS is sufficient to
        # detect CDN tampering; it is the same trust domain as the tarball.
        run: |
          HELM_VERSION="v3.17.0"
          HELM_ARCH="linux-amd64"
          HELM_FILE="helm-${HELM_VERSION}-${HELM_ARCH}.tar.gz"
          curl -fsSL "https://get.helm.sh/${HELM_FILE}" -o "/tmp/${HELM_FILE}"
          EXPECTED_SHA=$(curl -fsSL "https://get.helm.sh/${HELM_FILE}.sha256sum" | awk '{print $1}')
          ACTUAL_SHA=$(sha256sum "/tmp/${HELM_FILE}" | awk '{print $1}')
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "::error::SHA256 mismatch for ${HELM_FILE}: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}" >&2
            exit 1
          fi
          tar xz -C /tmp -f "/tmp/${HELM_FILE}"
          sudo mv "/tmp/${HELM_ARCH}/helm" /usr/local/bin/helm

      - name: Install oras
        # ORAS CLI for pushing Artifact Hub repository metadata as OCI artifact.
        # SHA256 verified before extraction — same supply-chain pattern as Helm.
        run: |
          ORAS_VERSION="1.2.3"
          ORAS_SHA256="b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827"
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/oras.tar.gz
          echo "${ORAS_SHA256}  /tmp/oras.tar.gz" | sha256sum --check --strict
          sudo tar xz -C /usr/local/bin -f /tmp/oras.tar.gz oras

      - name: Setup Helm chart dependencies
        uses: ./.github/actions/setup-helm-deps

      - name: Build chart dependencies
        run: helm dependency build ${{ matrix.chart.path }}

      - name: Read chart version
        id: chart
        run: |
          VERSION=$(grep '^version:' ${{ matrix.chart.path }}/Chart.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        env:
          REGISTRY: ghcr.io/ops-talks/helm-charts
        run: |
          NAME="${{ matrix.chart.name }}"
          VERSION="${{ steps.chart.outputs.version }}"
          if helm show chart "oci://${REGISTRY}/${NAME}" --version "${VERSION}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} of ${NAME} already published — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} of ${NAME} not yet published — will publish."
          fi

      - name: Log in to GHCR
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Log in to GHCR (oras)
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        if: steps.check.outputs.skip == 'false'
        id: package
        run: |
          mkdir -p /tmp/helm-packages
          helm package ${{ matrix.chart.path }} --destination /tmp/helm-packages/
          TGZ=$(ls /tmp/helm-packages/*.tgz)
          echo "tgz=${TGZ}" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR
        if: steps.check.outputs.skip == 'false'
        id: push
        env:
          REGISTRY: ghcr.io/ops-talks/helm-charts
        run: |
          OUTPUT=$(helm push "${{ steps.package.outputs.tgz }}" "oci://${REGISTRY}" 2>&1)
          echo "${OUTPUT}"
          DIGEST=$(echo "${OUTPUT}" | grep '^Digest:' | awk '{print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.check.outputs.skip == 'false'
        # FARM-S546 / E148: keyless signing via Sigstore Fulcio + Rekor.
        # id-token: write provides the OIDC token for the short-lived certificate.
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign chart with cosign (keyless)
        if: steps.check.outputs.skip == 'false'
        env:
          REGISTRY: ghcr.io/ops-talks/helm-charts
        run: |
          REF="${REGISTRY}/${{ matrix.chart.name }}@${{ steps.push.outputs.digest }}"
          echo "Signing ${REF}"
          cosign sign --yes "${REF}"

      - name: Push Artifact Hub repository metadata
        if: steps.check.outputs.skip == 'false'
        env:
          REGISTRY: ghcr.io/ops-talks/helm-charts
        run: |
          oras push "${REGISTRY}/${{ matrix.chart.name }}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            ${{ matrix.chart.path }}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Ensure GHCR package is public
        # ArtifactHub.io performs anonymous pulls against GHCR. GitHub creates
        # every new container package as private by default, which causes a 401
        # on the first index attempt. This step idempotently sets the package
        # visibility to public after every successful push so that ArtifactHub
        # can reach it without credentials.
        # || true: the first-ever push creates the package in the same run;
        # the PATCH may race against package creation and return 404. A
        # subsequent workflow run will succeed. This is acceptable because the
        # chart is not yet indexed during its first publication.
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENCODED_NAME=$(printf '%s' "helm-charts/${{ matrix.chart.name }}" | python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=''))")
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/ops-talks/packages/container/${ENCODED_NAME}" \
            -f visibility=public \
            --silent || true
          echo "Package helm-charts/${{ matrix.chart.name }} visibility set to public."
