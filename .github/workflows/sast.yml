name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 03:00 UTC to catch newly disclosed CVEs
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── CodeQL static analysis ────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
        # build-mode: none is correct for JS/TS — CodeQL analyses source
        # directly without requiring a compilation step.
        build-mode: [none]

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Use the security-extended query suite for broader coverage
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: '/language:${{ matrix.language }}'

  # ── Dependency vulnerability audit ───────────────────────────────────────
  npm-audit:
    name: npm audit (dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          compile-types: 'false'

      # Known upstream-unfixable advisories filtered by the script:
      #   GHSA-j3q9-mxjg-w52f, GHSA-27v5-c462-wpq7 — path-to-regexp pinned
      #   to exact "8.3.0" by @nestjs/core@11; fix requires NestJS to update
      #   their dep to >=8.4.0. npm overrides cannot substitute exact-pinned
      #   transitive deps. Track: https://github.com/nestjs/nest/issues
      - name: Audit API dependencies
        run: node scripts/audit-actionable.mjs apps/api

      - name: Audit Web dependencies
        run: node scripts/audit-actionable.mjs apps/web

  # ── ESLint security rules ─────────────────────────────────────────────────
  eslint-security:
    name: ESLint security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          compile-types: 'false'

      - name: Lint API (includes eslint-plugin-security)
        run: npm run lint -w apps/api

      - name: Lint Web (includes eslint-plugin-security)
        run: npm run web:lint

  # Roll-up job: single required check for branch protection rules.
  all-checks-passed:
    name: All checks passed (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [codeql, npm-audit, eslint-security]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed."
