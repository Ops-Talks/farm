name: SAST

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 03:00 UTC to catch newly disclosed CVEs
    - cron: '0 3 * * 1'

jobs:
  # ── CodeQL static analysis ────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use the security-extended query suite for broader coverage
          queries: security-extended

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  # ── Dependency vulnerability audit ───────────────────────────────────────
  npm-audit:
    name: npm audit (dependency CVEs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit API dependencies
        # --audit-level=high: fail only on high/critical CVEs; moderate are reported but don't block
        run: npm audit --audit-level=high --workspace=apps/api

      - name: Audit Web dependencies
        run: npm audit --audit-level=high --workspace=apps/web

  # ── ESLint security rules ─────────────────────────────────────────────────
  eslint-security:
    name: ESLint security rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile packages/types
        run: cd packages/types && npx tsc

      - name: Lint API (includes eslint-plugin-security)
        run: npm run lint -w apps/api

      - name: Lint Web (includes eslint-plugin-security)
        run: npm run web:lint
