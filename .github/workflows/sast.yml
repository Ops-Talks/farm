name: SAST

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 03:00 UTC to catch newly disclosed CVEs
    - cron: '0 3 * * 1'

jobs:
  # ── CodeQL static analysis ────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
        # build-mode: none is correct for JS/TS — CodeQL analyses source
        # directly without requiring a compilation step.
        build-mode: [none]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Use the security-extended query suite for broader coverage
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  # ── Dependency vulnerability audit ───────────────────────────────────────
  npm-audit:
    name: npm audit (dependency CVEs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit API dependencies
        # --omit=dev: exclude dev-only tools that have unfixable transitive vulns
        # Known upstream-unfixable advisories filtered below:
        #   GHSA-j3q9-mxjg-w52f, GHSA-27v5-c462-wpq7 — path-to-regexp pinned
        #   to exact "8.3.0" by @nestjs/core@11; fix requires NestJS to update
        #   their dep to >=8.4.0. npm overrides cannot substitute exact-pinned
        #   transitive deps. Track: https://github.com/nestjs/nest/issues
        run: |
          set +e
          AUDIT_JSON=$(npm audit --json --omit=dev --workspace=apps/api 2>&1)
          set -e
          echo "$AUDIT_JSON" | node -e "
            const UPSTREAM_UNFIXABLE = new Set([
              'GHSA-j3q9-mxjg-w52f',
              'GHSA-27v5-c462-wpq7'
            ]);
            const audit = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const vulns = Object.values(audit.vulnerabilities || {});
            const actionable = vulns.filter(v => {
              if (!['high','critical'].includes(v.severity)) return false;
              return v.via.some(via => {
                if (typeof via === 'string') return false;
                const id = via.url ? via.url.split('/').pop() : '';
                return !UPSTREAM_UNFIXABLE.has(id);
              });
            });
            if (actionable.length > 0) {
              console.error('Actionable high/critical vulnerabilities found:');
              actionable.forEach(v => console.error(' -', v.name, v.severity));
              process.exit(1);
            }
            const skipped = vulns.filter(v =>
              ['high','critical'].includes(v.severity) &&
              v.via.every(via => typeof via === 'string' || UPSTREAM_UNFIXABLE.has((via.url||'').split('/').pop()))
            );
            if (skipped.length) console.log('Skipped upstream-unfixable:', skipped.map(v=>v.name).join(', '));
            console.log('No actionable high/critical vulnerabilities found.');
          "

      - name: Audit Web dependencies
        # Known upstream-unfixable advisories filtered below:
        #   GHSA-j3q9-mxjg-w52f, GHSA-27v5-c462-wpq7 — root path-to-regexp@8.3.0
        #   is shared in the monorepo; @nestjs/core (API) pins it exactly to 8.3.0,
        #   preventing the web deps (router ^8.0.0) from resolving to 8.4.0.
        run: |
          set +e
          AUDIT_JSON=$(npm audit --json --omit=dev --workspace=apps/web 2>&1)
          set -e
          echo "$AUDIT_JSON" | node -e "
            const UPSTREAM_UNFIXABLE = new Set([
              'GHSA-j3q9-mxjg-w52f',
              'GHSA-27v5-c462-wpq7'
            ]);
            const audit = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const vulns = Object.values(audit.vulnerabilities || {});
            const actionable = vulns.filter(v => {
              if (!['high','critical'].includes(v.severity)) return false;
              return v.via.some(via => {
                if (typeof via === 'string') return false;
                const id = via.url ? via.url.split('/').pop() : '';
                return !UPSTREAM_UNFIXABLE.has(id);
              });
            });
            if (actionable.length > 0) {
              console.error('Actionable high/critical vulnerabilities found:');
              actionable.forEach(v => console.error(' -', v.name, v.severity));
              process.exit(1);
            }
            const skipped = vulns.filter(v =>
              ['high','critical'].includes(v.severity) &&
              v.via.every(via => typeof via === 'string' || UPSTREAM_UNFIXABLE.has((via.url||'').split('/').pop()))
            );
            if (skipped.length) console.log('Skipped upstream-unfixable:', skipped.map(v=>v.name).join(', '));
            console.log('No actionable high/critical vulnerabilities found.');
          "

  # ── ESLint security rules ─────────────────────────────────────────────────
  eslint-security:
    name: ESLint security rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile packages/types
        run: cd packages/types && npx tsc

      - name: Lint API (includes eslint-plugin-security)
        run: npm run lint -w apps/api

      - name: Lint Web (includes eslint-plugin-security)
        run: npm run web:lint
