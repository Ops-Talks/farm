name: Web CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  web:
    name: Lint, Test & Build (apps/web)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm' # caches ~/.npm based on package-lock.json

      # ── 3. Install ───────────────────────────────────────────────────────────
      - name: Install dependencies (all workspaces)
        run: npm ci
        # npm ci at the repo root installs every workspace in one shot:
        #   apps/web  +  packages/types  (and any other packages/*)

      # ── 4. Compile shared types ──────────────────────────────────────────────
      - name: Compile packages/types
        # apps/web imports from this package; tsc must run first so the
        # emitted .d.ts / .js files are present before next build resolves them.
        run: cd packages/types && npx tsc

      # ── 5. Lint ──────────────────────────────────────────────────────────────
      - name: Lint (apps/web)
        run: npm run web:lint

      # ── 6. Unit tests ────────────────────────────────────────────────────────
      - name: Unit tests with coverage (apps/web)
        run: npx vitest run --coverage
        working-directory: apps/web

      # ── 6a. Upload coverage to Codecov ───────────────────────────────────────
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.3
        if: always()
        with:
          files: ./apps/web/coverage/lcov.info
          flags: web
          name: web-coverage
          slug: Ops-Talks/farm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      # ── 6b. Upload test results to Codecov ───────────────────────────────────
      - name: Upload unit test results to Codecov
        uses: codecov/codecov-action@v5.5.3
        if: always()
        with:
          files: ./apps/web/coverage/junit.xml
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      # ── 7. Build ─────────────────────────────────────────────────────────────
      - name: Build (apps/web)
        run: npm run web:build
        env:
          # Opt out of Next.js anonymous telemetry data collection in CI.
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: E2E Tests — Playwright (apps/web)
    runs-on: ubuntu-latest
    # Run after the build job so we know the app at least compiles cleanly
    needs: web

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install workspace dependencies ───────────────────────────────────
      - name: Install dependencies (all workspaces)
        run: npm ci

      # ── 4. Compile shared types ──────────────────────────────────────────────
      - name: Compile packages/types
        run: cd packages/types && npx tsc

      # ── 5. Install Playwright browser binaries ───────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: apps/web

      # ── 6. Run E2E tests ─────────────────────────────────────────────────────
      - name: Run E2E tests (apps/web)
        run: npm run test:e2e
        working-directory: apps/web
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1

      # ── 7. Upload test artefacts on failure ──────────────────────────────────
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results-all-browsers
          path: apps/web/test-results/
          retention-days: 7

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-html-report-all-browsers
          path: apps/web/playwright-report/
          retention-days: 7

