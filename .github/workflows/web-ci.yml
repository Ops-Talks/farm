name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Lint, Test & Build (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # ── 2. Setup ─────────────────────────────────────────────────────────────
      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      # ── 3. Lint ──────────────────────────────────────────────────────────────
      - name: Lint (apps/web)
        run: npm run web:lint

      # ── 4. Unit tests ────────────────────────────────────────────────────────
      - name: Unit tests with coverage (apps/web)
        run: npx vitest run --coverage
        working-directory: apps/web

      # ── 4a. Upload coverage to Codecov ───────────────────────────────────────
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        if: always()
        with:
          files: ./apps/web/coverage/lcov.info
          flags: web
          name: web-coverage
          slug: Ops-Talks/farm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      # ── 4b. Upload test results to Codecov ───────────────────────────────────
      - name: Upload unit test results to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        if: always()
        with:
          files: ./apps/web/coverage/junit.xml
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          fail_ci_if_error: false

      # ── 5. Build ─────────────────────────────────────────────────────────────
      - name: Build (apps/web)
        run: npm run web:build
        env:
          # Opt out of Next.js anonymous telemetry data collection in CI.
          NEXT_TELEMETRY_DISABLED: 1

      # ── 6. Persist build output for downstream jobs (e2e, lighthouse) ────────
      - name: Upload .next build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-next-build
          path: |
            apps/web/.next
            !apps/web/.next/cache
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  e2e:
    name: E2E Tests — Playwright (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run after the build job so we know the app at least compiles cleanly
    needs: web

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # ── 2. Setup ─────────────────────────────────────────────────────────────
      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      # ── 3. Download pre-built .next output from the web job ──────────────────
      - name: Download .next build output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: web-next-build
          path: apps/web/.next

      # ── 4. Install Playwright browser binary for this shard only ─────────────
      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/web

      # ── 5. Run E2E tests for this browser only ───────────────────────────────
      - name: Run E2E tests — ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}
        working-directory: apps/web
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1

      # ── 6. Upload test artefacts on failure ──────────────────────────────────
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: apps/web/test-results/
          retention-days: 7

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-html-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: web
    # Lighthouse results are informational; a score regression does not block
    # the PR. Set continue-on-error so the roll-up job is not affected.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      # Reuse .next from the web job so we don't rebuild from scratch.
      - name: Download .next build output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: web-next-build
          path: apps/web/.next

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: apps/web/.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouse-reports/
          retention-days: 14
          include-hidden-files: true


  # Roll-up job: single required check for branch protection rules.
  # lighthouse is intentionally excluded (continue-on-error: true; advisory).
  all-checks-passed:
    name: All checks passed (Web CI)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [web, e2e]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed."
