name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      confirm-major:
        description: 'Type YES to confirm a major release (required when increment is major)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Pre-flight — verify CI is green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Guard — require confirmation for major releases
        if: github.event.inputs.increment == 'major'
        env:
          CONFIRM_MAJOR: ${{ github.event.inputs.confirm-major }}
        run: |
          if [[ "$CONFIRM_MAJOR" != "YES" ]]; then
            echo "::error::Major release requires confirm-major='YES'. Got: '${CONFIRM_MAJOR}'"
            exit 1
          fi
          echo "Major release confirmed."

      - name: Verify latest CI / SAST / Trivy runs on ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_WORKFLOWS: 'ci.yml web-ci.yml sast.yml trivy.yml'
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          echo "Checking required workflows on ref '$REF' for commit '$TARGET_SHA'..."
          FAILED=0
          for WF in $REQUIRED_WORKFLOWS; do
            # Fetch recent completed runs for this workflow on this ref and require a run for the exact commit being released.
            RUNS_JSON=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/${WF}/runs?branch=${REF}&status=completed&per_page=20")
            CONCLUSION=$(printf '%s' "$RUNS_JSON" | jq -r --arg sha "$TARGET_SHA" \
              '.workflow_runs | map(select(.head_sha == $sha)) | .[0].conclusion // "missing"')
            echo " - ${WF} @ ${TARGET_SHA}: ${CONCLUSION}"
            if [[ "$CONCLUSION" != "success" && "$CONCLUSION" != "skipped" ]]; then
              echo "::error::${WF} does not have a successful completed run for commit '${TARGET_SHA}' on ref '${REF}'."
              FAILED=1
            fi
          done
          if [[ "$FAILED" -ne 0 ]]; then
            echo "::error::One or more required workflows are not green for commit '${TARGET_SHA}' on '${REF}'. Refusing to release."
            exit 1
          fi
          echo "All required workflows are green for commit '${TARGET_SHA}'."

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          # persist-credentials defaults to true — intentional: release-it needs
          # to push the version bump commit and tags back to the repository.

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          compile-types: 'false'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Release
        run: npm run release -w apps/api -- --ci --increment=${{ github.event.inputs.increment || 'patch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Generate SBOM for the released codebase and store as a workflow artifact.
      # The SBOM is not auto-attached to the GitHub Release because this workflow
      # is triggered via workflow_dispatch (not a release event), so the anchore
      # action cannot reliably detect the newly created release tag.
      # TODO(SLSA L2): When Docker images are published to GHCR, add
      # actions/attest-build-provenance with permissions id-token:write and
      # attestations:write to generate cosign attestations per image digest.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: sbom.spdx.json
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      # Expose the freshly bumped version to downstream jobs so they can attach
      # per-image SBOMs to the GitHub Release created by release-it.
      - name: Capture released version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/api/package.json').version")"
          echo "Released version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

  # FARM-S544 / FARM-E132: build, push, sign, and attest the official farm-api
  # and farm-web container images on every release. The job:
  #
  #   1. Logs into GHCR using the workflow's GITHUB_TOKEN (no long-lived PAT).
  #   2. Builds a multi-arch manifest list (linux/amd64 + linux/arm64) via
  #      buildx + QEMU emulation on the default ubuntu-latest amd64 runner
  #      (FARM-S547).
  #   3. Pushes the image to ghcr.io/ops-talks/<name> tagged with the semver
  #      version and "latest", with `sbom: true` + `provenance: mode=max` so
  #      SLSA provenance and an SPDX SBOM attestation are attached per
  #      platform via the OCI 1.1 referrers API.
  #   4. Signs the pushed manifest with cosign keyless (Sigstore Fulcio +
  #      Rekor) using the GHA OIDC token (FARM-S546).
  #   5. Emits a stand-alone SPDX SBOM file and attaches it as a release
  #      asset on the GitHub Release created by release-it, so downstream
  #      consumers without cosign/oras can still grab the SBOM.
  #
  # Permissions:
  #   contents: write  — required to attach SBOMs to the GitHub Release.
  #   packages: write  — required to push images to GHCR.
  #   id-token: write  — required for cosign keyless signing (OIDC).
  images-sbom:
    name: Image SBOM + sign — ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: release
    permissions:
      contents: write
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: farm-api
            dockerfile: apps/api/Dockerfile
            target: production
          - name: farm-web
            dockerfile: apps/web/Dockerfile
            target: runner
    env:
      # GHCR requires the owner segment to be lowercase. The Farm org is
      # "Ops-Talks" on GitHub; we hardcode the lowercased form here rather
      # than relying on a shell `tr` step so the value is visible in the
      # workflow file and easy to audit.
      REGISTRY: ghcr.io
      IMAGE_BASE: ghcr.io/ops-talks/${{ matrix.image.name }}
    steps:
      - name: Checkout released tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Set up QEMU (multi-arch emulation)
        # FARM-S547: enables building linux/arm64 on the default amd64
        # ubuntu-latest runner. ARM builds via QEMU are ~3-5x slower than
        # native; switch to GitHub-hosted ARM runners (`ubuntu-24.04-arm`)
        # once they are GA for private repos to recover that wall time.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push ${{ matrix.image.name }} image (multi-arch, with SBOM + provenance)
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-release
          cache-to: type=gha,scope=${{ matrix.image.name }}-release,mode=max
          # sbom: true embeds an SPDX SBOM attestation per platform via the
          # OCI 1.1 referrers API. provenance: mode=max produces a full
          # SLSA v1.0 provenance attestation including build invocation
          # parameters. Both are signed implicitly with the same OIDC
          # identity buildx uses for keyless attestation.
          sbom: true
          provenance: mode=max

      - name: Install cosign
        # FARM-S546: keyless signing via Sigstore Fulcio + Rekor. The OIDC
        # token from `id-token: write` is exchanged for a short-lived
        # signing certificate; no key material is stored in the repo or in
        # GitHub Secrets. Verification instructions live in
        # deploy/helm/farm/README.md under "Image Provenance and Signing".
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign pushed image with cosign (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE_BASE}@${IMAGE_DIGEST}"
          echo "Signing ${REF}"
          cosign sign --yes "${REF}"

      - name: Generate SPDX SBOM file for ${{ matrix.image.name }}
        # Even though build-push-action already attached an SPDX attestation
        # to the manifest, we also emit a stand-alone file so the GitHub
        # Release page carries a downloadable SBOM for consumers without
        # cosign/oras. We point anchore at the pushed digest (not a local
        # docker image, since multi-arch + push is incompatible with
        # `load: true`).
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_BASE }}@${{ steps.build.outputs.digest }}
          artifact-name: ${{ matrix.image.name }}-sbom.spdx.json
          format: spdx-json
          output-file: ${{ matrix.image.name }}-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach SBOM to GitHub Release ${{ needs.release.outputs.tag }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: ${{ matrix.image.name }}-sbom.spdx.json
          fail_on_unmatched_files: true
