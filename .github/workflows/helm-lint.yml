name: Helm Lint & Validate

on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm-lint.yml'

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit SHA for supply-chain security (not just tag).
      # Keep SHA current — use `gh api /repos/{owner}/{repo}/git/ref/tags/{tag}`
      # to resolve the latest SHA for each pinned action.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
            | DESIRED_VERSION=v3.17.0 bash

      - name: Set up chart-testing
        uses: helm/chart-testing-action@0d28d3144d3a25ea2cc349d6e59901c4ff469b3b # v2.7.0

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Helm dependency build
        run: |
          helm dependency build deploy/helm/farm
          helm dependency build deploy/helm/observability

      # values-dev.yaml provides a non-default JWT_SECRET and a valid externalDatabase.host,
      # which prevents the validate.yaml template from calling `fail` during lint.
      - name: Helm lint
        run: helm lint deploy/helm/farm -f deploy/helm/farm/values-dev.yaml

      - name: Helm template (dev values)
        run: helm template farm deploy/helm/farm -f deploy/helm/farm/values-dev.yaml > /tmp/manifests-dev.yaml

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate manifests with kubeconform
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/manifests-dev.yaml

      - name: Chart testing lint
        run: ct lint --config deploy/helm/ct.yaml --chart-dirs deploy/helm
