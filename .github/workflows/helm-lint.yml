name: Helm Lint & Validate

on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm-lint.yml'

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit SHA for supply-chain security (not just tag).
      # Keep SHA current — use `gh api /repos/{owner}/{repo}/git/ref/tags/{tag}`
      # to resolve the latest SHA for each pinned action.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16b55cfce6461c9d8ba0f01e # v4.3.0
        with:
          version: '3.17.0'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@0d28d3144d3a25ea2cc349d6e59901c4ff469b3b # v2.7.0

      - name: Helm dependency update
        run: helm dependency update deploy/helm/farm

      - name: Helm lint
        run: helm lint deploy/helm/farm

      - name: Helm template (dev values)
        run: helm template farm deploy/helm/farm -f deploy/helm/farm/values-dev.yaml > /tmp/manifests-dev.yaml

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate manifests with kubeconform
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/manifests-dev.yaml

      - name: Chart testing lint
        run: ct lint --config deploy/helm/ct.yaml --chart-dirs deploy/helm
