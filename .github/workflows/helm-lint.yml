name: Helm Lint & Validate

on:
  workflow_call:
    inputs:
      run_ct_install:
        description: 'Run ct install on KinD — pass true on pull_request events'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned by commit SHA for supply-chain security (not just tag).
      # Keep SHA current — use `gh api /repos/{owner}/{repo}/git/ref/tags/{tag}`
      # to resolve the latest SHA for each pinned action.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Helm
        # Download the tarball and verify SHA256 before extracting.
        # Fetching the checksum from get.helm.sh over TLS is sufficient to
        # detect CDN tampering; it is the same trust domain as the tarball.
        run: |
          HELM_VERSION="v3.17.0"
          HELM_ARCH="linux-amd64"
          HELM_FILE="helm-${HELM_VERSION}-${HELM_ARCH}.tar.gz"
          curl -fsSL "https://get.helm.sh/${HELM_FILE}" -o "/tmp/${HELM_FILE}"
          EXPECTED_SHA=$(curl -fsSL "https://get.helm.sh/${HELM_FILE}.sha256sum" | awk '{print $1}')
          ACTUAL_SHA=$(sha256sum "/tmp/${HELM_FILE}" | awk '{print $1}')
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "::error::SHA256 mismatch for ${HELM_FILE}: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}" >&2
            exit 1
          fi
          tar xz -C /tmp -f "/tmp/${HELM_FILE}"
          sudo mv "/tmp/${HELM_ARCH}/helm" /usr/local/bin/helm

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Setup Helm chart dependencies
        uses: ./.github/actions/setup-helm-deps

      - name: Install ah CLI
        # Artifact Hub linter — verifies annotations, README, and schema.
        # Binary install with SHA256 verification; no docker run.
        # Version 0.19.0 does not exist; using current stable 1.22.0.
        run: |
          AH_VERSION="1.22.0"
          AH_SHA256="c845307d19f822905b7c47b3f216712116dd74709802c7d1d4a9b6f999d6f92a"
          curl -fsSL "https://github.com/artifacthub/hub/releases/download/v${AH_VERSION}/ah_${AH_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/ah.tar.gz
          echo "${AH_SHA256}  /tmp/ah.tar.gz" | sha256sum --check --strict
          sudo tar xz -C /usr/local/bin -f /tmp/ah.tar.gz ah

      # values-dev.yaml provides a non-default JWT_SECRET and a valid externalDatabase.host,
      # which prevents the validate.yaml template from calling `fail` during lint.
      - name: Helm lint
        run: helm lint deploy/helm/farm --strict -f deploy/helm/farm/values-dev.yaml

      - name: Helm template (dev values)
        run: helm template farm deploy/helm/farm -f deploy/helm/farm/values-dev.yaml > /tmp/manifests-dev.yaml

      - name: Helm lint (observability, strict)
        run: helm lint deploy/helm/observability --strict -f deploy/helm/observability/values-dev.yaml

      - name: Helm template (observability dev values)
        run: helm template farm-obs deploy/helm/observability -f deploy/helm/observability/values-dev.yaml > /dev/null

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="v0.7.0"
          KUBECONFORM_SHA256="c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum --check --strict
          tar xz -C /usr/local/bin -f /tmp/kubeconform.tar.gz

      - name: Validate manifests with kubeconform
        run: |
          # Retry up to 3 times — raw.githubusercontent.com is subject to rate limiting
          for i in 1 2 3; do
            kubeconform -strict -summary -cache /tmp/.kubeconform-cache \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              /tmp/manifests-dev.yaml && break
            echo "kubeconform attempt $i failed, retrying in 5s..."
            sleep 5
          done

      - name: Chart testing lint
        run: ct lint --config deploy/helm/ct.yaml

      - name: Artifact Hub lint
        run: |
          ah lint --kind helm --path deploy/helm/farm
          ah lint --kind helm --path deploy/helm/observability

  ct-install:
    name: Chart Testing Install (KinD)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: helm-lint
    # Only run ct install on pull_request events (passed as input from ci.yml).
    # Prevents unnecessary KinD spin-ups on push-to-main and workflow_call-only contexts.
    if: inputs.run_ct_install
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config deploy/helm/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create KinD cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Setup Helm chart dependencies
        if: steps.list-changed.outputs.changed == 'true'
        uses: ./.github/actions/setup-helm-deps

      - name: Set up Docker Buildx
        if: steps.list-changed.outputs.changed == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build farm-api image (CI)
        if: steps.list-changed.outputs.changed == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: false
          load: true
          tags: ghcr.io/ops-talks/farm-api:ci-local
          cache-from: type=gha,scope=farm-api-ci
          cache-to: type=gha,scope=farm-api-ci,mode=max

      - name: Build farm-web image (CI)
        if: steps.list-changed.outputs.changed == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: false
          load: true
          tags: ghcr.io/ops-talks/farm-web:ci-local
          cache-from: type=gha,scope=farm-web-ci
          cache-to: type=gha,scope=farm-web-ci,mode=max

      - name: Load images into KinD cluster
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kind load docker-image ghcr.io/ops-talks/farm-api:ci-local --name chart-testing
          kind load docker-image ghcr.io/ops-talks/farm-web:ci-local --name chart-testing

      - name: Run ct install
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config deploy/helm/ct.yaml
