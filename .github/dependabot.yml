version: 2
updates:
  # Root monorepo — covers all npm workspaces (apps/api, apps/web, packages/*)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Security advisories are opened immediately as individual PRs (no group)
      # so they can be reviewed and merged in isolation.
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
      # Non-security minor/patch updates are batched into a single weekly PR
      # to reduce review noise.
      non-critical-updates:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      # js-yaml v5 dropped the ESM default export that swagger-client and
      # swagger-ui-react (apps/web, via @nestjs/swagger UI) depend on via
      # `import jsYaml from 'js-yaml'`, breaking the Turbopack production
      # build. Re-evaluate once swagger-client ships a v5-compatible release.
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native Go rewrite ("Corsa"), shipped as a preview.
      # It removes node/node10 module resolution (TS5108), lacks declaration
      # emit (required by @farm/types and apps/api), and is rejected by
      # ts-jest (peer <7) and typescript-eslint (peer <6.1.0). Revisit once
      # the toolchain supports it. See Phase 65 in ROADMAP.md.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — keep action versions and SHA pins up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5

  # Docker base images — scanned separately per app to limit blast radius
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: wednesday

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: wednesday

  # Python — mkdocs build toolchain (docs/requirements.txt)
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 3
