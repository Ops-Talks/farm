name: Setup monorepo
description: Set up Node 26, run npm ci, optionally compile shared types. Caller must checkout the repo first.
inputs:
  compile-types:
    description: Whether to compile packages/types via tsc
    required: false
    default: 'true'
  skip-toolchain:
    description: Skip Node/npm toolchain setup (use when the caller already ran setup-node-toolchain earlier in the job)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node toolchain
      if: inputs.skip-toolchain != 'true'
      uses: ./.github/actions/setup-node-toolchain

    - name: Install dependencies (all workspaces)
      shell: bash
      run: npm ci

    - name: Compile packages/types
      if: inputs.compile-types == 'true'
      shell: bash
      run: |
        cd packages/types && npx tsc && npm link
        npm link @farm/types
