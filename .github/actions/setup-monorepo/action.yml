name: Setup monorepo
description: Set up Node 26, run npm ci, optionally compile shared types. Caller must checkout the repo first.
inputs:
  compile-types:
    description: Whether to compile packages/types via tsc
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Node.js 26
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '26'
        cache: 'npm'

    - name: Pin npm to v11
      shell: bash
      run: |
        corepack enable
        corepack install -g npm@^11

    - name: Install dependencies (all workspaces)
      shell: bash
      run: npm ci

    - name: Compile packages/types
      if: inputs.compile-types == 'true'
      shell: bash
      run: cd packages/types && npx tsc
