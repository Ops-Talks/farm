name: Setup monorepo
description: Set up Node 20, run npm ci, optionally compile shared types. Caller must checkout the repo first.
inputs:
  compile-types:
    description: Whether to compile packages/types via tsc
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Node.js 20
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies (all workspaces)
      shell: bash
      run: npm ci

    - name: Compile packages/types
      if: inputs.compile-types == 'true'
      shell: bash
      run: cd packages/types && npx tsc
