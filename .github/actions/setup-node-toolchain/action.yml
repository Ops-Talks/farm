name: Setup Node toolchain
description: Set up Node 26 and pin npm to v11 via corepack. Caller must checkout the repo first.

runs:
  using: composite
  steps:
    - name: Set up Node.js 26
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '26'
        cache: 'npm'

    - name: Pin npm to v11
      shell: bash
      run: |
        corepack enable
        corepack install -g npm@^11
