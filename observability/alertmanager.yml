# Alertmanager base configuration — works without any external integrations.
#
# By default all alerts are routed to the "null" receiver (silently dropped).
# This is intentional for local development: the observability stack runs
# fully without requiring Slack or any other notification channel.
#
# For production, copy observability/alertmanager-slack.yml over this file
# (or mount it instead) and set ALERTMANAGER_SLACK_WEBHOOK_URL in your
# environment. The Slack config uses --config.expand-env=true to read the
# webhook URL from the container's environment variable.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'

receivers:
  - name: 'null'

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'service']
