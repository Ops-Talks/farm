server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: status
            values: [running]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
        replacement: farm
      - target_label: job
        replacement: docker
    pipeline_stages:
      # Try to parse JSON (Winston format). Non-JSON logs pass through unchanged.
      - json:
          expressions:
            level: level
            msg: message
            context: context
      # Promote level/context as stream labels only when present (Winston logs)
      - labels:
          level:
          context:
