global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "farm-api"
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["farm-api:3000"]
        labels:
          service: "farm-api"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
          instance: "farm-host"
