services:
  api:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_ENDPOINT: "http://tempo:4318/v1/traces"
      OTEL_SERVICE_NAME: "farm-api"
    depends_on:
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: farm-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.7.2
    container_name: farm-tempo
    restart: always
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yaml:ro
    command: ["-config.file=/etc/tempo/config.yaml"]

  grafana:
    image: grafana/grafana:11.6.0
    container_name: farm-grafana
    restart: always
    ports:
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
