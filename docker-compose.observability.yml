services:
  api:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_ENDPOINT: "http://alloy:4318/v1/traces"
      OTEL_SERVICE_NAME: "farm-api"
      LOKI_URL: "http://loki:3100"
      PROMETHEUS_URL: "http://prometheus:9090"
      TEMPO_URL: "http://tempo:3200"
      PYROSCOPE_ENABLED: "true"
      PYROSCOPE_URL: "http://pyroscope:4040"
    depends_on:
      alloy:
        condition: service_started
      loki:
        condition: service_healthy

  web:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_ENDPOINT: "http://alloy:4318/v1/traces"
      OTEL_SERVICE_NAME: "farm-web"
      NEXT_PUBLIC_FARO_URL: "http://localhost:12347/collect"

  loki:
    image: grafana/loki:3.4.2
    container_name: farm-loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yaml:ro
      - ./observability/loki-rules.yml:/etc/loki/rules/fake/rules.yml:ro
      - loki-data:/var/loki
    command: -config.file=/etc/loki/config.yaml
    user: "0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  promtail:
    image: grafana/promtail:3.4.2
    container_name: farm-promtail
    restart: always
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: farm-node-exporter
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: farm-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--alertmanager.notification-queue-capacity=10000"
      - "--web.enable-remote-write-receiver"
    depends_on:
      api:
        condition: service_healthy
      node-exporter:
        condition: service_started
      alertmanager:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: farm-alertmanager
    restart: always
    ports:
      - "9093:9093"
    environment:
      ALERTMANAGER_SLACK_WEBHOOK_URL: ${ALERTMANAGER_SLACK_WEBHOOK_URL:-http://localhost}
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--config.expand-env=true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  tempo:
    image: grafana/tempo:2.7.2
    container_name: farm-tempo
    restart: always
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yaml:ro
      - ./observability/tempo-overrides.yaml:/etc/tempo/overrides.yaml:ro
    command: ["-config.file=/etc/tempo/config.yaml"]

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: farm-alloy
    restart: always
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12347:12347"
    environment:
      FARO_CORS_ALLOWED_ORIGINS: "${FARO_CORS_ALLOWED_ORIGINS:-http://localhost:3001}"
    volumes:
      - ./observability/alloy.river:/etc/alloy/config.river:ro
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.river"]
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_healthy

  pyroscope:
    image: grafana/pyroscope:1.13.1
    container_name: farm-pyroscope
    restart: always
    ports:
      - "4040:4040"
    volumes:
      - pyroscope-data:/data
    command: ["server"]

  grafana:
    image: grafana/grafana:11.6.14
    container_name: farm-grafana
    restart: always
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-farm}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-farm}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_INSTALL_PLUGINS: "grafana-pyroscope-app"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_healthy

volumes:
  loki-data:
  alertmanager-data:
  pyroscope-data:
