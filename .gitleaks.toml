# Gitleaks configuration for Farm
# Docs: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

title = "farm-gitleaks"

[extend]
# Extend the default ruleset shipped with gitleaks
useDefault = true

# ── Allowlist ─────────────────────────────────────────────────────────────────
# These are intentional test fixtures, documentation examples, and placeholder
# defaults — NOT real secrets.
#
# NOTE: gitleaks 8.21.x does not honor the [[allowlists]] (array-of-tables)
# syntax when the config also sets extend.useDefault = true. We consolidate
# everything into a single global [allowlist] block, which is the syntax that
# is verified to work with the default ruleset extension.
[allowlist]
description = "Farm-wide allowlist for test fixtures, doc examples, and placeholder defaults"

paths = [
  # Test fixtures with hardcoded JWT secrets and placeholder credentials
  '''apps/api/test/helpers/e2e-setup\.ts''',
  # CI workflow — contains ephemeral test-only credentials for PostgreSQL and
  # Swagger that are created fresh per job run and destroyed when the job ends.
  # Real secrets use ${{ secrets.NAME }} and are never committed.
  '''.github/workflows/ci\.yml''',
  '''apps/api/src/modules/auth/strategies/keycloak\.strategy\.spec\.ts''',
  '''apps/api/src/modules/auth/keycloak-sync\.service\.spec\.ts''',
  '''apps/api/src/modules/pipelines/pipeline\.processor\.spec\.ts''',
  '''apps/api/src/modules/auth/strategies/jwt\.strategy\.spec\.ts''',
  '''apps/api/src/modules/auth/strategies/google\.strategy\.spec\.ts''',
  '''apps/api/src/modules/auth/strategies/github\.strategy\.spec\.ts''',
  '''apps/api/src/modules/integrations/integration-credential\.service\.spec\.ts''',
  '''apps/api/src/modules/cloud/gcp/gcp\.service\.spec\.ts''',
]

regexes = [
  # Configuration default placeholder (must be overridden in production)
  '''super-secret-key-change-me-in-production''',
  # ZAP DAST test user password — hardcoded test credential for CI scanning only
  '''Zap@12345!''',
  # Illustrative example password used in authentication user-guide docs
  '''SecurePass1''',
  # Truncated JWT placeholder used in authentication docs (eyJhbGci... prefix is a
  # well-known example header — no real payload follows)
  '''eyJhbGciOiJIUzI1NiIs''',
  # Truncated hex refresh-token placeholders used in authentication docs
  '''a1b2c3d4e5f6''',
  '''f6e5d4c3b2a1''',
  # UUID token placeholder used in an early version of docs/api-reference/auth.md
  # (commit f596bed) — a static example value, not a real credential
  '''7c9e6679-7425-40de-944b-e07fc1f90ae7''',
  # Illustrative temp-password returned by POST /api/v1/users/:id/reset-password
  # when SMTP is not configured — a documentation example, not a real credential
  '''abCD12efGH34''',
]
